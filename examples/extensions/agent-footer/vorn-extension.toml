# An example extension: a footer on each agent's card with the model the
# session was started with and the tool calls its hooks report.
id = "example.agent-footer"
name = "Agent footer"
version = "1.0.0"
api = "vorn:extension@1.0"
description = "Shows each agent's model and its last tool call under its card."

[declares]
uses = ["sessions.read"]

[build]
command = ["cargo", "build", "--release", "--target", "wasm32-wasip2", "--target-dir", "target"]

[service]
component = "target/wasm32-wasip2/release/vorn_example_agent_footer.wasm"
events = ["session.created", "session.exited", "agent.hook"]

[[contributes.card_footers]]
id = "tools"
tree = true
