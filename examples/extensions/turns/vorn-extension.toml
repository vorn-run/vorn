# An example extension: counts each agent's turns and shows them where Vorn
# lets an extension draw, with an element tree for every place that takes one.
id = "example.turns"
name = "Turns"
version = "1.0.0"
api = "vorn:extension@0.9"
description = "Counts each agent's turns, shows them on its card and lists the latest finishes."

[declares]
uses = ["sessions.read"]

[build]
command = ["cargo", "build", "--release", "--target", "wasm32-wasip2", "--target-dir", "target"]

[service]
component = "target/wasm32-wasip2/release/vorn_example_turns.wasm"
events = ["session.created", "session.status", "session.exited"]

[[contributes.sidebar]]
id = "finished"
title = "Finished turns"
tree = true

[[contributes.badges]]
id = "count"
tree = true

[[contributes.card_footers]]
id = "last"
tree = true

[[contributes.decorations]]
id = "line"
tree = true

[[contributes.panes]]
id = "all"
title = "Turns"
tree = true

[[contributes.composer]]
id = "summary"
tree = true

[[contributes.settings]]
id = "prefs"
title = "Turns"
description = "What Turns counts, and the list it keeps."
icon = "history"
tree = true

[[contributes.windows]]
id = "turns"
title = "Turns"
tree = true
size = [300, 360]

[[contributes.dialogs]]
id = "clear"
title = "Clear Finished Turns"
tree = true

[[contributes.commands]]
id = "toggle"
title = "Toggle Turns Window"
key = "Mod+Alt+T"
window = "turns"
icon = "history"

[[contributes.commands]]
id = "clear-finished"
title = "Clear Finished Turns…"
call = "ask-clear"
icon = "trash-2"

[[contributes.menus]]
id = "reset"
title = "Reset Turn Count"
menu = "card"
call = "reset"
icon = "rotate-ccw"

[[contributes.launchers]]
id = "window"
title = "Watch turns"
window = "turns"
icon = "history"
