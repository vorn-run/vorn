# The shipped set: builds the extension packs packages/core/shipped.toml pins
# from the extensions repository at the lock's rev, checks each sha256, and
# points vornd's build at them. The packs are cached on the lock, across
# platforms, so every runner embeds the same bytes.
name: Shipped set
description: Build and verify the extension packs vornd ships
runs:
  using: composite
  steps:
    - name: Read the lock
      id: lock
      shell: bash
      run: echo "rev=$(sed -n 's/^rev *= *"\(.*\)"/\1/p' packages/core/shipped.toml)" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v7
      with:
        repository: vorn-run/extensions
        ref: ${{ steps.lock.outputs.rev }}
        path: .extensions

    - id: cache
      uses: actions/cache@v6
      with:
        path: packages/core/shipped
        key: shipped-v1-${{ hashFiles('packages/core/shipped.toml') }}
        enableCrossOsArchive: true

    - name: Build the packs
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: node packages/core/scripts/shipped.mjs --from .extensions

    - name: Point the build at them
      shell: bash
      run: |
        {
          echo "VORN_SHIPPED_DIR=$GITHUB_WORKSPACE/packages/core/shipped"
          echo "VORN_SHIPPED_REQUIRED=1"
          echo "VORN_EXTENSIONS_DIR=$GITHUB_WORKSPACE/.extensions"
        } >> "$GITHUB_ENV"
