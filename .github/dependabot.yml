version: 2
updates:
  # One entry for the whole workspace: a single yarn.lock at the root resolves
  # every workspace manifest together.
  # TypeScript 7 is the native rewrite and breaks the lint toolchain; hold its
  # major bump. Minor and patch updates still flow.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']

  # The Rust workspace: vornd, the session holder, vornui and the apps.
  - package-ecosystem: 'cargo'
    directory: '/packages/core'
    schedule:
      interval: 'weekly'
    groups:
      cargo-minor-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns: ['*']
