name: flake-hunt
on:
  push:
    branches: [handoff-test-flake]
jobs:
  hunt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install
      - name: Full suite with coverage, as CI runs it
        run: yarn test:coverage 2>&1 | grep -aE "\[heir\]|\[parent\]|handoff-adopted-pty|Tests  " || true
