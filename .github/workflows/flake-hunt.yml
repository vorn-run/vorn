name: flake-hunt
on:
  push:
    branches: [handoff-test-flake]
jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install
      - name: Run the handoff test 15 times
        run: |
          for i in $(seq 1 15); do
            echo "=== run $i"
            npx vitest run tests/handoff-adopted-pty.test.ts 2>&1 | grep -aE "\[heir\]|\[parent\]|Tests  " || true
          done
