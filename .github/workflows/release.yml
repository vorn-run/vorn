name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Determine tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(jq -r .version package.json)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"

          is_prerelease=false
          if [[ "$tag" == *"-beta"* ]] || [[ "$tag" == *"-alpha"* ]] || [[ "$tag" == *"-rc"* ]]; then
            is_prerelease=true
          fi

          # Check if release already exists
          if gh release view "$tag" &>/dev/null; then
            echo "Release $tag already exists, skipping creation"
          else
            echo "Creating release $tag (prerelease=$is_prerelease)"
            flags="--draft --title $tag --generate-notes"
            if [ "$is_prerelease" = true ]; then
              flags="$flags --prerelease"
            fi
            gh release create "$tag" $flags
          fi

  build-macos:
    needs: create-release
    # macos-15, not latest: Zig 0.15.2 cannot link against the newer macOS SDK.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      # vornd, vorn-sessiond and vorn ship in every build; libghostty-vt needs Zig 0.15.2.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      # The version comes from packages/core/rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: packages/core
        run: rustup toolchain install

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core/target
          key: core-${{ runner.os }}-${{ hashFiles('packages/core/Cargo.lock', 'packages/core/rust-toolchain.toml') }}
          restore-keys: core-${{ runner.os }}-

      - name: Import code signing certificate
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MAC_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          # A new keychain locks itself after 5 minutes, and codesign then waits
          # forever for a password. Keep it unlocked for the whole job.
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: Install dependencies
        run: yarn install

      - name: Sync version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            npm pkg set version="$VERSION"
            echo "Set version to $VERSION"
          fi

      # The crates' versions and Cargo.lock follow package.json, so every binary reports the tag.
      - name: Sync crate versions
        shell: bash
        run: bash scripts/sync-versions.sh

      - name: Build native core
        run: yarn build:core

      - name: Build
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          yarn build
          yarn dist --publish never

      # A release without the server would not start, so a missing binary fails the build.
      - name: Packaged core present
        shell: bash
        run: |
          for name in vornd/vornd vornd/vorn-sessiond vornd/vorn; do
            # Exact, or with .exe: vornd/vorn is a prefix of vornd/vornd.
            file=$(find dist \( -ipath "*/resources/$name" -o -ipath "*/resources/$name.exe" \) -type f -print -quit)
            if [ -z "$file" ]; then
              echo "ERROR: $name is not in the packaged resources"
              exit 1
            fi
            echo "found $file"
          done

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(node -p 'require("./package.json").version')"
          fi

          # Determine if this is a beta release
          is_beta=false
          if [[ "$tag" == *"-beta"* ]] || [[ "$tag" == *"-alpha"* ]] || [[ "$tag" == *"-rc"* ]]; then
            is_beta=true
          fi

          # Upload platform artifacts
          for f in dist/*.dmg dist/*.dmg.blockmap dist/*.zip dist/*.zip.blockmap; do
            [ -f "$f" ] && gh release upload "$tag" "$f" --clobber
          done

          # Upload update metadata file
          # For beta: rename latest-mac.yml → beta-mac.yml so electron-updater finds it
          if [ "$is_beta" = true ] && [ -f dist/latest-mac.yml ]; then
            cp dist/latest-mac.yml dist/beta-mac.yml
            gh release upload "$tag" dist/beta-mac.yml --clobber
          fi
          [ -f dist/latest-mac.yml ] && gh release upload "$tag" dist/latest-mac.yml --clobber

      - name: Clean up keychain
        if: always()
        run: security delete-keychain build.keychain || true

  build-windows:
    needs: create-release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      # vornd, vorn-sessiond and vorn ship in every build; libghostty-vt needs Zig 0.15.2.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      # The version comes from packages/core/rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: packages/core
        run: rustup toolchain install

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core/target
          key: core-${{ runner.os }}-${{ hashFiles('packages/core/Cargo.lock', 'packages/core/rust-toolchain.toml') }}
          restore-keys: core-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install

      - name: Sync version from tag
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            npm pkg set version="$version"
            Write-Output "Set version to $version"
          }

      # The crates' versions and Cargo.lock follow package.json, so every binary reports the tag.
      - name: Sync crate versions
        shell: bash
        run: bash scripts/sync-versions.sh

      - name: Build native core
        run: yarn build:core

      - name: Build
        run: |
          yarn build
          yarn dist --publish never

      # A release without the server would not start, so a missing binary fails the build.
      - name: Packaged core present
        shell: bash
        run: |
          # The ConPTY vorn-sessiond hosts Windows sessions in ships beside it.
          for name in vornd/vornd vornd/vorn-sessiond vornd/vorn vornd/conpty.dll vornd/x64/OpenConsole.exe; do
            # Exact, or with .exe: vornd/vorn is a prefix of vornd/vornd.
            file=$(find dist \( -ipath "*/resources/$name" -o -ipath "*/resources/$name.exe" \) -type f -print -quit)
            if [ -z "$file" ]; then
              echo "ERROR: $name is not in the packaged resources"
              exit 1
            fi
            echo "found $file"
          done

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v" + (node -p "require('./package.json').version")
          }

          $is_beta = $tag -match '-(beta|alpha|rc)'

          Get-ChildItem dist\*.exe, dist\*.blockmap | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
          }

          # Upload update metadata
          if ($is_beta -and (Test-Path dist\latest.yml)) {
            Copy-Item dist\latest.yml dist\beta.yml
            gh release upload $tag dist\beta.yml --clobber
          }
          if (Test-Path dist\latest.yml) {
            gh release upload $tag dist\latest.yml --clobber
          }

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      # vornd, vorn-sessiond and vorn ship in every build; libghostty-vt needs Zig 0.15.2.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      # The version comes from packages/core/rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: packages/core
        run: rustup toolchain install

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core/target
          key: core-${{ runner.os }}-${{ hashFiles('packages/core/Cargo.lock', 'packages/core/rust-toolchain.toml') }}
          restore-keys: core-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install

      - name: Sync version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            npm pkg set version="$VERSION"
            echo "Set version to $VERSION"
          fi

      # The crates' versions and Cargo.lock follow package.json, so every binary reports the tag.
      - name: Sync crate versions
        shell: bash
        run: bash scripts/sync-versions.sh

      - name: Build native core
        run: yarn build:core

      - name: Build
        run: |
          yarn build
          yarn dist --publish never

      # A release without the server would not start, so a missing binary fails the build.
      - name: Packaged core present
        shell: bash
        run: |
          for name in vornd/vornd vornd/vorn-sessiond vornd/vorn; do
            # Exact, or with .exe: vornd/vorn is a prefix of vornd/vornd.
            file=$(find dist \( -ipath "*/resources/$name" -o -ipath "*/resources/$name.exe" \) -type f -print -quit)
            if [ -z "$file" ]; then
              echo "ERROR: $name is not in the packaged resources"
              exit 1
            fi
            echo "found $file"
          done

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(node -p 'require("./package.json").version')"
          fi

          is_beta=false
          if [[ "$tag" == *"-beta"* ]] || [[ "$tag" == *"-alpha"* ]] || [[ "$tag" == *"-rc"* ]]; then
            is_beta=true
          fi

          for f in dist/*.AppImage dist/*.deb dist/*.rpm; do
            [ -f "$f" ] && gh release upload "$tag" "$f" --clobber
          done

          if [ "$is_beta" = true ] && [ -f dist/latest-linux.yml ]; then
            cp dist/latest-linux.yml dist/beta-linux.yml
            gh release upload "$tag" dist/beta-linux.yml --clobber
          fi
          [ -f dist/latest-linux.yml ] && gh release upload "$tag" dist/latest-linux.yml --clobber

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serialised, in order: a dependent must not reach the registry before
      # the package it depends on, or installing it fails until the other
      # lands. The matrix runs top to bottom at max-parallel 1.
      max-parallel: 1
      matrix:
        include:
          - name: '@vornrun/connector-sdk'
            directory: packages/connector-sdk
          - name: '@vornrun/mcp'
            directory: packages/mcp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      # Every publishable package, not just the one being published: a
      # `workspace:^` dependency is rewritten at pack time using the version
      # found in the workspace, so bumping only the matrix package would ship
      # a dependency range pointing at the version we are replacing.
      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for dir in packages/connector-sdk packages/mcp; do
            (cd "$dir" && npm pkg set version="$VERSION")
          done

      - name: Build package
        run: yarn workspace ${{ matrix.name }} build

      - name: Publish to npm
        working-directory: ${{ matrix.directory }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="${GITHUB_REF_NAME}"

          # Determine npm dist-tag: beta releases get "beta" tag, stable get "latest"
          NPM_TAG="latest"
          if [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            NPM_TAG="beta"
          fi

          PUBLISHED=$(npm view "${{ matrix.name }}@$VERSION" version 2>/dev/null || echo "none")
          if [ "$VERSION" = "$PUBLISHED" ]; then
            echo "Version $VERSION already published, skipping"
          else
            yarn npm publish --access public --tag "$NPM_TAG"
            echo "Published ${{ matrix.name }}@$VERSION with dist-tag '$NPM_TAG'"
          fi
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
