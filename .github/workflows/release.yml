name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(jq -r .version package.json)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"

          is_prerelease=false
          if [[ "$tag" == *"-beta"* ]] || [[ "$tag" == *"-alpha"* ]] || [[ "$tag" == *"-rc"* ]]; then
            is_prerelease=true
          fi

          # Check if release already exists
          if gh release view "$tag" &>/dev/null; then
            echo "Release $tag already exists, skipping creation"
          else
            echo "Creating release $tag (prerelease=$is_prerelease)"
            flags="--draft --title $tag --generate-notes"
            if [ "$is_prerelease" = true ]; then
              flags="$flags --prerelease"
            fi
            gh release create "$tag" $flags
          fi

  # Vorn for every platform, and the update feeds the installed apps read.
  build:
    needs: create-release
    uses: ./.github/workflows/native-app.yml
    with:
      tag: ${{ needs.create-release.outputs.tag }}
    secrets: inherit

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serialised, in order: a dependent must not reach the registry before
      # the package it depends on, or installing it fails until the other
      # lands. The matrix runs top to bottom at max-parallel 1.
      max-parallel: 1
      matrix:
        include:
          - name: '@vornrun/connector-sdk'
            directory: packages/connector-sdk
          - name: '@vornrun/mcp'
            directory: packages/mcp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      # Every publishable package, not just the one being published: a
      # `workspace:^` dependency is rewritten at pack time using the version
      # found in the workspace, so bumping only the matrix package would ship
      # a dependency range pointing at the version we are replacing.
      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for dir in packages/connector-sdk packages/mcp; do
            (cd "$dir" && npm pkg set version="$VERSION")
          done

      - name: Build package
        run: yarn workspace ${{ matrix.name }} build

      - name: Publish to npm
        working-directory: ${{ matrix.directory }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="${GITHUB_REF_NAME}"

          # Determine npm dist-tag: beta releases get "beta" tag, stable get "latest"
          NPM_TAG="latest"
          if [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            NPM_TAG="beta"
          fi

          PUBLISHED=$(npm view "${{ matrix.name }}@$VERSION" version 2>/dev/null || echo "none")
          if [ "$VERSION" = "$PUBLISHED" ]; then
            echo "Version $VERSION already published, skipping"
          else
            yarn npm publish --access public --tag "$NPM_TAG"
            echo "Published ${{ matrix.name }}@$VERSION with dist-tag '$NPM_TAG'"
          fi
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
