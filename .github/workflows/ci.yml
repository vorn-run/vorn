name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request supersedes its running checks; runs on main all
# finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything but the test suite. None of it needs the native core.
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Typecheck
        run: yarn typecheck

      - name: Lockfile has no private registry references
        # Installs behind a corporate npm mirror make Yarn pin tarballs to that
        # mirror via __archiveUrl, which leaks an internal host into this public
        # repo and breaks installs for everyone else.
        run: yarn lint:lockfile

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

  # The web client: the app compiled to WebAssembly, served by a test vornd to
  # headless Chromium, which types into a terminal on WebGPU, on WebGL2 and
  # after pairing by code, and works an extension's template page.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Rust toolchain
        working-directory: packages/core
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Brotli
        run: sudo apt-get update && sudo apt-get install -y brotli

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core/target
          key: web-v1-${{ runner.os }}-${{ hashFiles('packages/core/Cargo.lock', 'packages/core/rust-toolchain.toml') }}
          restore-keys: web-v1-${{ runner.os }}-

      - name: Lint the browser build
        working-directory: packages/core
        run: cargo clippy --locked --profile wasm --target wasm32-unknown-unknown -p vorn-web -p vornui -p vorn-app --lib -- -D warnings

      - name: Build the web client
        run: yarn build:web

      - name: Build vornd and vorn-sessiond
        working-directory: packages/core
        run: cargo build --locked --profile ci -p vornd -p vorn-sessiond

      - name: Chromium
        run: yarn playwright-core install --with-deps chromium

      - name: Types into a terminal in the browser
        working-directory: packages/core
        env:
          SHOTS: ${{ runner.temp }}/web-shots
        run: node crates/vorn-web/tests/smoke.mjs webgpu webgl pair templates adapters phone-chromium

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: web-shots
          path: ${{ runner.temp }}/web-shots
          retention-days: 7
          if-no-files-found: ignore

  # The test suite, split across runners. Each part prints its results and
  # writes them with its coverage to a blob report, which the ci job merges.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      # The tests start vornd, vorn-sessiond and vorn, built here with Zig 0.16.0 for libghostty-vt.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # The version comes from packages/core/rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: packages/core
        run: rustup toolchain install

      # Its own key, so this build-only cache never takes the Core workflow's
      # slot. target/ holds the Ghostty checkout and Zig's caches as well as
      # cargo's. v2: built without LTO, so nothing from the v1 cache applies.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core/target
          key: core-ci-v2-${{ runner.os }}-${{ hashFiles('packages/core/Cargo.lock', 'packages/core/rust-toolchain.toml') }}
          restore-keys: core-ci-v2-${{ runner.os }}-

      # The tests only need the binaries to run, so this skips the
      # whole-program LTO pass the shipped build does: the Core workflow
      # builds and packages that one.
      - name: Build the native core
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: yarn build:core

      # Its own temporary directory, so what the tests leave there can be told from the runner's.
      - name: Test temporary directory
        run: |
          mkdir -p "$RUNNER_TEMP/vorn-tests"
          echo "TMPDIR=$RUNNER_TEMP/vorn-tests" >> "$GITHUB_ENV"

      - name: Test
        run: yarn vitest run --coverage --reporter=default --reporter=blob --shard=${{ matrix.shard }}/3

      - name: No processes left behind
        if: ${{ !cancelled() }}
        run: node scripts/check-leftover-processes.mjs --wait 15 "$TMPDIR" "$GITHUB_WORKSPACE"

      # Failed runs too, so the ci job's merged report lists every failure.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
          # A re-run shard replaces its earlier report, so the merge sees the re-run.
          overwrite: true

  # The required check: merges the test results and coverage, holds a pull
  # request to 80% patch coverage, and passes only when the jobs above did.
  ci:
    needs: [checks, web, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install diff-cover
        run: pip install diff-cover

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true

      # Fails, listing the failed tests, when any part had a failure.
      - name: Merge test results and coverage
        run: yarn vitest --merge-reports --coverage

      - name: Enforce 80% patch coverage
        if: github.event_name == 'pull_request'
        run: diff-cover coverage/lcov.info --compare-branch=origin/${{ github.base_ref }} --fail-under=80

      - name: Checks and tests passed
        if: ${{ !cancelled() }}
        env:
          CHECKS: ${{ needs.checks.result }}
          WEB: ${{ needs.web.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "checks: $CHECKS, web: $WEB, test: $TEST"
          [ "$CHECKS" = success ] && [ "$WEB" = success ] && [ "$TEST" = success ]
