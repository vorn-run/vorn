name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request supersedes its running checks; runs on main all
# finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything but the test suite. None of it needs the native core.
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Typecheck
        run: yarn typecheck

      # The completion index is committed and the corpus that generates it is
      # not a dependency, so this verifies the committed index was built from
      # the committed allowlist rather than re-running the generator.
      - name: Completion index matches allowlist
        run: node scripts/check-completion-allowlist.mjs

      - name: Lockfile has no private registry references
        # Installs behind a corporate npm mirror make Yarn pin tarballs to that
        # mirror via __archiveUrl, which leaks an internal host into this public
        # repo and breaks installs for everyone else.
        run: yarn lint:lockfile

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Verify server CJS bundle
        run: |
          yarn workspace @vornrun/server build
          # Fail if import.meta snuck into CJS bundle (causes runtime crash in Electron)
          if grep -q 'import_meta' packages/server/dist/index.cjs; then
            echo "ERROR: import_meta found in CJS bundle — will crash at runtime"
            exit 1
          fi
          # Smoke-test: require the bundle — fails immediately if module-level code crashes
          node -e "
            process.on('uncaughtException', (e) => {
              if (e.code === 'ERR_INVALID_ARG_TYPE' || e.code === 'ERR_INVALID_URL') {
                console.error('Server bundle crash:', e.message);
                process.exit(1);
              }
              // Ignore other async errors (missing workers, etc.)
            });
            try { require('./packages/server/dist/index.cjs'); } catch(e) {
              if (e.code === 'ERR_INVALID_ARG_TYPE' || e.code === 'ERR_INVALID_URL') {
                console.error('Server bundle crash:', e.message);
                process.exit(1);
              }
            }
            setTimeout(() => process.exit(0), 2000);
          "

      - name: Verify production build
        # Catches renderer/main/preload build regressions (e.g. Vite 8 rolldown
        # rejecting object-form manualChunks) that the unit tests don't exercise.
        # The server bundle is already built in the step above.
        run: |
          yarn build:web
          yarn electron-vite build

      - name: Verify preload artifacts
        # The main process hard-codes out/preload/index.js and widget-preload.js.
        # Vite 8 rolldown once emitted .mjs instead and bundled the npm electron
        # shim into the preload, leaving window.api undefined in the packaged app.
        run: |
          for f in out/main/index.js out/preload/index.js out/preload/widget-preload.js; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f missing — main process loads this exact path"
              exit 1
            fi
          done
          if grep -rq 'Electron failed to install correctly' out/main out/preload; then
            echo "ERROR: npm electron shim bundled into build output — 'electron' was not externalized"
            exit 1
          fi
          if ! grep -q 'require("electron")' out/preload/index.js; then
            echo "ERROR: out/preload/index.js does not require('electron') externally"
            exit 1
          fi

  # The test suite, split across runners. Each part prints its results and
  # writes them with its coverage to a blob report, which the ci job merges.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      # The server runs its terminals on the Rust core, so the tests need
      # vorn_core.node. libghostty-vt-sys builds Ghostty's VT library with Zig,
      # and the Ghostty commit it pins refuses any Zig but 0.15.2.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      # The version comes from packages/core/rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: packages/core
        run: rustup toolchain install

      # Its own key, so this build-only cache never takes the Core workflow's
      # slot. target/ holds the Ghostty checkout and Zig's caches as well as
      # cargo's. v2: built without LTO, so nothing from the v1 cache applies.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core/target
          key: core-ci-v2-${{ runner.os }}-${{ hashFiles('packages/core/Cargo.lock', 'packages/core/rust-toolchain.toml') }}
          restore-keys: core-ci-v2-${{ runner.os }}-

      # The tests only need the core to load and run, so this skips the
      # whole-program LTO pass the shipped build does: the Core workflow
      # builds and packages that one.
      - name: Build the native core
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: yarn build:core

      - name: Test
        run: yarn vitest run --coverage --reporter=default --reporter=blob --shard=${{ matrix.shard }}/3

      # Failed runs too, so the ci job's merged report lists every failure.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # The required check: merges the test results and coverage, holds a pull
  # request to 80% patch coverage, and passes only when the jobs above did.
  ci:
    needs: [checks, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install diff-cover
        run: pip install diff-cover

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      # Fails, listing the failed tests, when any part had a failure.
      - name: Merge test results and coverage
        run: yarn vitest --merge-reports --coverage

      - name: Enforce 80% patch coverage
        if: github.event_name == 'pull_request'
        run: diff-cover coverage/lcov.info --compare-branch=origin/${{ github.base_ref }} --fail-under=80

      - name: Checks and tests passed
        if: ${{ !cancelled() }}
        env:
          CHECKS: ${{ needs.checks.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "checks: $CHECKS, test: $TEST"
          [ "$CHECKS" = success ] && [ "$TEST" = success ]
