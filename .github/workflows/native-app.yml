# Builds Vorn, the native desktop app (vorn-app), in release with the vornd,
# vorn-sessiond and vorn it ships and the web client vornd serves, packages
# it for each platform with packages/core/scripts/package-native.mjs, and
# writes the release's update feeds with release-feeds.mjs. The release
# workflow calls it with the tag to upload the assets to; a pull request that
# changes the packaging runs it to check every platform still packages.
# Before the feeds go up, the previous release's app updates onto this build.
name: Native app

on:
  workflow_call:
    inputs:
      tag:
        description: The release to upload the assets to; empty keeps them as artifacts only
        type: string
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-app.yml'
      - 'packages/core/scripts/package-native.mjs'
      - 'packages/core/scripts/build-web.sh'
      - 'packages/core/scripts/release-feeds.mjs'
      - 'packages/core/scripts/update-path.mjs'
      - 'packages/core/scripts/vorn.nsi'
      - 'packages/core/crates/vorn-app/src/cli_link.rs'
      - 'packages/core/crates/vorn-app/src/launch.rs'
      - 'packages/core/crates/vorn-app/src/update.rs'
      - '.github/workflows/release.yml'
      - '.github/actions/shipped/**'
      - 'packages/core/shipped.toml'

jobs:
  # The web client is WebAssembly, the same on every platform, so it is built once.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        working-directory: packages/core
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Brotli
        run: sudo apt-get update && sudo apt-get install -y brotli

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core/target
          key: web-v1-${{ runner.os }}-${{ hashFiles('packages/core/Cargo.lock', 'packages/core/rust-toolchain.toml') }}
          restore-keys: web-v1-${{ runner.os }}-

      - name: Build the web client
        run: sh packages/core/scripts/build-web.sh

      - uses: actions/upload-artifact@v7
        with:
          name: web-client
          path: packages/core/crates/vorn-web/dist
          retention-days: 1
          if-no-files-found: error

  package:
    name: ${{ matrix.name }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15, not latest: Zig, which builds vornd's terminal library, cannot read newer SDKs.
          - name: mac-arm64
            os: macos-15
          - name: mac-x64
            os: macos-15-intel
          - name: win-x64
            os: windows-2022
          # The oldest supported Ubuntu, so the binaries run on older glibc too.
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      # vornd serves it from resources/web/dist.
      - uses: actions/download-artifact@v8
        with:
          name: web-client
          path: packages/core/crates/vorn-web/dist

      # vornd's session engine parses with libghostty-vt, which needs Zig 0.16.0.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # The version comes from packages/core/rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: packages/core
        run: rustup toolchain install

      # The extension packs vornd ships, from shipped.toml.
      - uses: ./.github/actions/shipped

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core/target
          key: native-${{ matrix.name }}-${{ hashFiles('packages/core/Cargo.lock', 'packages/core/rust-toolchain.toml') }}
          restore-keys: native-${{ matrix.name }}-

      # The browser pane embeds WebKitGTK on Linux.
      - name: Web view libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Sync version from tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: npm pkg set version="${TAG#v}"

      # The crates' versions follow package.json, so the app reports the tag.
      - name: Sync crate versions
        run: bash scripts/sync-versions.sh

      # vornd on its own: built with vorn, cargo would link vorn's Wasm compiler into it too.
      - name: Build
        working-directory: packages/core
        run: |
          cargo build --release --locked -p vornd
          cargo build --release --locked -p vorn-sessiond -p vorn-cli -p vorn-app

      # vorn-sessiond hosts Windows sessions in the ConPTY shipped beside it.
      - name: ConPTY
        if: runner.os == 'Windows'
        working-directory: packages/core
        run: node scripts/fetch-conpty.mjs --out target/release

      - name: Import code signing certificate
        if: runner.os == 'macOS'
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MAC_CERTIFICATE" ]; then
            echo "No signing certificate: the app is signed ad hoc."
            exit 0
          fi
          echo "$MAC_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          # A new keychain locks itself after 5 minutes, and codesign then waits
          # forever for a password. Keep it unlocked for the whole job.
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      # appimagetool runs extracted (APPIMAGE_EXTRACT_AND_RUN), so the runner needs no FUSE.
      - name: appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      # Signed only when a code signing certificate is configured; unsigned otherwise.
      - name: Package
        env:
          WIN_CERTIFICATE: ${{ secrets.WIN_CERTIFICATE }}
          WIN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node packages/core/scripts/package-native.mjs

      - name: Clean up keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain build.keychain || true

      # The packaged app's server, helpers and CLI run.
      - name: Packaged app runs
        timeout-minutes: 10
        run: |
          dir=$(mktemp -d)
          case "$RUNNER_OS" in
            macOS) ditto -x -k dist-native/Vorn-*-mac.zip "$dir"; res="$dir/Vorn.app/Contents/Resources"; x= ;;
            Windows)
              # The installer itself, silently, as the updater runs it.
              # MSYS2_ARG_CONV_EXCL: Git Bash would turn /S into a path.
              MSYS2_ARG_CONV_EXCL="*" ./dist-native/Vorn-Setup-*.exe /S
              inst="$(cygpath -u "$LOCALAPPDATA")/Programs/vorn"
              test -f "$inst/Vorn.exe"
              res="$inst/resources"; x=.exe ;;
            Linux) dpkg-deb -x dist-native/vorn_*.deb "$dir"; res="$dir/opt/Vorn/resources"; x= ;;
          esac
          test -f "$res/web/dist/index.html"
          # A file, not a pipe: on Windows the sessiond vornd starts inherits a pipe and holds it open.
          "$res/vornd/vornd$x" --data-dir "$dir/data" --port 0 --exit-with-stdin < /dev/null > "$dir/vornd.out"
          out=$(head -n 1 "$dir/vornd.out")
          echo "$out"
          case "$out" in
            '{"port":'*) ;;
            *) echo "ERROR: vornd did not say where it listens"; exit 1 ;;
          esac
          "$res/vornd/vorn-sessiond$x" --version
          "$res/vornd/vorn$x" --version
          if [ "$RUNNER_OS" = Windows ]; then
            taskkill //F //IM vorn-sessiond.exe || true
            MSYS2_ARG_CONV_EXCL="*" "$inst/Uninstall Vorn.exe" /S "_?=$(cygpath -w "$inst")"
            test ! -e "$inst/Vorn.exe"
            test ! -e "$inst/resources"
          fi

      # Installing Vorn puts the vorn command on PATH: the installer on Windows,
      # the package on Linux, and the app's launch step (a temp HOME and
      # VORN_CLI_DIR here) for the AppImage and on macOS.
      - name: The vorn command is installed
        timeout-minutes: 10
        run: |
          dir=$(mktemp -d)
          case "$RUNNER_OS" in
            Windows)
              MSYS2_ARG_CONV_EXCL="*" ./dist-native/Vorn-Setup-*.exe /S
              inst="$(cygpath -u "$LOCALAPPDATA")/Programs/vorn"
              want="$(cygpath -w "$inst")\resources\vornd"
              user_path() { powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path','User')"; }
              count() { user_path | tr ';' '\n' | tr -d '\r' | grep -icxF "$want" || true; }
              user_path
              test "$(count)" = 1
              # A terminal opened now finds it.
              powershell -NoProfile -Command "\$env:Path = [Environment]::GetEnvironmentVariable('Path','User') + ';' + [Environment]::GetEnvironmentVariable('Path','Machine'); vorn --version"
              # The app's own launch step agrees and adds no second entry.
              "$inst/Vorn.exe" install-cli --data-dir "$(cygpath -w "$dir/data")" > "$dir/cli.out"
              cat "$dir/cli.out"
              test "$(count)" = 1
              MSYS2_ARG_CONV_EXCL="*" "$inst/Uninstall Vorn.exe" /S "_?=$(cygpath -w "$inst")"
              user_path
              test "$(count)" = 0 ;;
            Linux)
              sudo apt-get install -y "$PWD"/dist-native/vorn_*.deb
              test "$(readlink /usr/bin/vorn)" = /opt/Vorn/resources/vornd/vorn
              vorn --version
              sudo apt-get remove -y vorn
              test ! -e /usr/bin/vorn
              image=$(ls "$PWD"/dist-native/Vorn-*.AppImage)
              HOME="$dir/home" VORN_CLI_DIR="$dir/bin" APPIMAGE_EXTRACT_AND_RUN=1 "$image" install-cli --data-dir "$dir/data"
              test "$(readlink "$dir/bin/vorn")" = "$image"
              HOME="$dir/home" APPIMAGE_EXTRACT_AND_RUN=1 "$dir/bin/vorn" --version ;;
            macOS)
              ditto -x -k dist-native/Vorn-*-mac.zip "$dir"
              HOME="$dir/home" VORN_CLI_DIR="$dir/bin" "$dir/Vorn.app/Contents/MacOS/Vorn" install-cli --data-dir "$dir/data"
              case "$(readlink "$dir/bin/vorn")" in
                */Vorn.app/Contents/Resources/vornd/vorn) ;;
                *) echo "ERROR: the link points elsewhere"; exit 1 ;;
              esac
              HOME="$dir/home" "$dir/bin/vorn" --version ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: vorn-native-${{ matrix.name }}
          path: |
            dist-native/Vorn-*
            dist-native/vorn_*
          if-no-files-found: error

      - name: Upload to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          gh release upload "$TAG" dist-native/Vorn-* dist-native/vorn_* --clobber

  # The update feed, from every platform's assets.
  feeds:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync version from tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: npm pkg set version="${TAG#v}"

      - uses: actions/download-artifact@v8
        with:
          pattern: vorn-native-*
          path: dist-native
          merge-multiple: true

      - name: Write the feed
        run: node packages/core/scripts/release-feeds.mjs --dir dist-native

      - uses: actions/upload-artifact@v7
        with:
          name: vorn-update-feeds
          path: dist-native/vorn-update.json
          if-no-files-found: error

  # The previous release, installed with a temp HOME and data dir, updates
  # onto this build through `Vorn update`, from a feed served on the runner.
  update-path:
    name: update path ${{ matrix.name }}
    needs: [package, feeds]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-15
          - name: win-x64
            os: windows-2022
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: vorn-native-${{ matrix.name }}
          path: update-path

      - uses: actions/download-artifact@v8
        with:
          name: vorn-update-feeds
          path: update-path

      # The app links WebKitGTK for the browser pane.
      - name: Web view libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0

      - name: An installed Vorn updates to this build
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node packages/core/scripts/update-path.mjs
          --dir update-path --key ${{ matrix.name }} --work "$RUNNER_TEMP/update-path-work"

  # The feed goes up last, so no install sees a release its predecessor cannot update onto.
  publish-feeds:
    if: inputs.tag != ''
    needs: [feeds, update-path]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vorn-update-feeds
          path: dist-native

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist-native/vorn-update.json --clobber --repo "$GITHUB_REPOSITORY"
