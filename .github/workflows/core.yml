name: Core

# Builds the Rust core (packages/core) and packages the app with it, so a change
# that breaks the crate, the libghostty-vt build or the way the binary ships
# shows up before it reaches a release. Pull requests and pushes to main build
# on Linux only; macOS and Windows are built by the release workflow and on a
# manual run here, which keeps the per-change cost to one runner.

on:
  push:
    branches: [main]
    paths: &paths
      - 'packages/core/**'
      - 'tests/fixtures/js-reference/**'
      - 'tests/fixtures/launch-lines.json'
      - 'tests/native-server-workflows.test.ts'
      - 'tests/helpers/served.ts'
      - 'packages/shared/src/types.ts'
      - 'packages/shared/src/store-types.ts'
      - 'scripts/gen-store-schema.mjs'
      - 'packages/mcp/src/**'
      - 'scripts/gen-mcp-tools.mjs'
      - 'tests/native-server-mcp.test.ts'
      - 'tests/helpers/mcp-parity.ts'
      - 'tests/mcp-relay.test.ts'
      - 'tests/native-cli.test.ts'
      - 'tests/helpers/cli-reference.ts'
      - 'tests/fixtures/cli-reference.json'
      - 'THIRD_PARTY_NOTICES.md'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/core.yml'
  pull_request:
    branches: [main]
    paths: *paths
  # Every OS once a night; pull requests and pushes test Linux only.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      os:
        description: Runner to build and test on
        type: choice
        options: [all, ubuntu, macos, windows]
        default: all
      crates:
        description: Rust crates to test, space separated (empty tests the whole workspace)
        type: string
        default: ''
      quick:
        description: Stop after the Rust tests (skip the vornd tests, packaging and the packaged checks)
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request supersedes its running checks; runs on main all
# finish.
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A night with no new commits to the core or the tests skips the run.
  changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "$(git log --since='25 hours ago' --format=%H -1 -- packages/core tests package.json yarn.lock .github/workflows/core.yml)" ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  core:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macos-15, not latest: Zig 0.15.2 could not read the newer macOS SDK's
        # libSystem and fails to link even its own build runner there.
        os: ${{ github.event_name == 'schedule' && fromJSON('["ubuntu-latest", "macos-15", "windows-2022"]') || github.event_name != 'workflow_dispatch' && fromJSON('["ubuntu-latest"]') || inputs.os == 'ubuntu' && fromJSON('["ubuntu-latest"]') || inputs.os == 'macos' && fromJSON('["macos-15"]') || inputs.os == 'windows' && fromJSON('["windows-2022"]') || fromJSON('["ubuntu-latest", "macos-15", "windows-2022"]') }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      # libghostty-vt-sys builds Ghostty's VT library from source with Zig. The
      # Ghostty commit it pins refuses any Zig but 0.16.0.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # The version comes from packages/core/rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: packages/core
        run: rustup toolchain install

      # target/ holds the Ghostty checkout and Zig's caches as well as cargo's,
      # which is most of a cold build. v2 holds the ci profile's dependencies
      # too, and starts from the release-only cache before it.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core/target
          key: core-v2-${{ runner.os }}-${{ hashFiles('packages/core/Cargo.lock', 'packages/core/rust-toolchain.toml') }}
          restore-keys: |
            core-v2-${{ runner.os }}-
            core-${{ runner.os }}-

      # Files unchanged since the cached target's commit get an old mtime, so cargo rebuilds only the crates that changed.
      - name: Keep unchanged crates built
        shell: bash
        run: |
          stamp=packages/core/target/.built-from
          if [ -f "$stamp" ] && built=$(cat "$stamp") && git fetch --quiet --depth=1 origin "$built"; then
            git ls-files -z | xargs -0 touch -t 200001010000
            git diff --name-only --diff-filter=d "$built" HEAD | while IFS= read -r f; do touch "$f"; done
            echo "cached target built from $built; $(git diff --name-only "$built" HEAD | wc -l) files changed since"
          else
            echo "no usable record of what the cached target was built from; building everything"
          fi
          rm -f "$stamp"
          # Only a run that builds every crate and profile leaves a target that matches HEAD.
          if [ "$QUICK" != true ] && [ -z "$CRATES" ]; then
            mkdir -p packages/core/target
            git rev-parse HEAD > "$stamp"
          fi
        env:
          QUICK: ${{ inputs.quick }}
          CRATES: ${{ inputs.crates }}

      - name: Install dependencies
        run: yarn install

      - name: Rust format
        if: runner.os == 'Linux'
        working-directory: packages/core
        run: cargo fmt --all --check

      # The desktop app's browser pane embeds WebKitGTK on Linux.
      - name: Web view libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Clippy
        working-directory: packages/core
        run: cargo clippy --release --locked --workspace --all-targets -- -D warnings

      # Its own temporary directory (TMP and TEMP on Windows), so what the tests leave there can be told from the runner's.
      - name: Test temporary directory
        shell: bash
        run: |
          dir="$RUNNER_TEMP/vorn-tests"
          mkdir -p "$dir"
          { echo "TMPDIR=$dir"; echo "TMP=$dir"; echo "TEMP=$dir"; } >> "$GITHUB_ENV"

      # nextest runs the test binaries side by side instead of one after another; doc tests run separately.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.145

      # The Wasm component vorn-extensions' wasm tests load (they skip without it).
      - name: Wasm test component
        working-directory: packages/core
        run: |
          rustup target add wasm32-wasip2
          cargo build --profile ci --locked --target wasm32-wasip2 -p ext-tiers-component

      # Every crate in one run, so each compiles once. Cargo
      # builds the binaries the tests start (vornd, vorn-sessiond, the recovery
      # programs) side by side in target/ci. On Windows sessiond hosts its
      # sessions in the ConPTY the app ships, so the gate test installs it
      # beside sessiond too. The parity tests in vorn-git compare against the
      # git each runner has.
      - name: Rust tests
        working-directory: packages/core
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            node scripts/fetch-conpty.mjs
            export VORN_CONPTY_DIR="$(cygpath -w "$PWD")"
          fi
          if [ -n "$CRATES" ]; then
            packages=$(printf -- '-p %s ' $CRATES)
          else
            packages='--workspace'
          fi
          cargo nextest run --cargo-profile ci --locked --no-fail-fast --no-tests=warn $packages
          cargo test --doc --profile ci --locked --no-fail-fast $packages
        env:
          CRATES: ${{ inputs.crates }}

      # The many-pane bench at a small N, so it keeps running; its numbers on a
      # shared runner are not a baseline.
      - name: Many-pane bench
        if: ${{ runner.os == 'Linux' && !inputs.crates }}
        working-directory: packages/core
        timeout-minutes: 5
        run: |
          cargo build --profile ci --locked -p vornd -p vorn-sessiond -p vorn-app --example many_panes
          target/ci/examples/many_panes --panes 4 --cases mixed,hidden --seconds 2

      # How fast the app opens, nightly on macOS. A shared runner's numbers are
      # reported, not held to the budgets.
      - name: Startup bench
        if: ${{ runner.os == 'macOS' && github.event_name == 'schedule' }}
        working-directory: packages/core
        timeout-minutes: 15
        run: STARTUP_BENCH_REPORT_ONLY=1 ./scripts/startup-bench.sh

      # The terminal scrolling test again, saving what each step looks like.
      - name: Scroll screenshots
        if: ${{ runner.os == 'Linux' && !inputs.crates }}
        working-directory: packages/core
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          VORN_APP_SHOT="$RUNNER_TEMP/shots/native" cargo nextest run --cargo-profile ci --locked -p vorn-app --test live -E 'test(scrolls_its_history)'

      - uses: actions/upload-artifact@v7
        if: ${{ always() && runner.os == 'Linux' && !inputs.crates }}
        with:
          name: native-scroll-shots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: warn

      # The store's protocol types are generated from packages/shared; the
      # committed schema has to be the one the TypeScript gives today.
      - name: Store schema is current
        if: ${{ !inputs.quick && (runner.os == 'Linux') }}
        run: node scripts/gen-store-schema.mjs --check

      # vornd's MCP tools and their argument schemas are generated from
      # packages/mcp the same way.
      - name: MCP tool definitions are current
        if: ${{ !inputs.quick && (runner.os == 'Linux') }}
        run: node scripts/gen-mcp-tools.mjs --check

      # Pull requests reuse the ci profile the tests compiled; main and the nightly run build the shipping release.
      - name: Build vornd and vorn
        if: ${{ !inputs.quick }}
        shell: bash
        env:
          PROFILE: ${{ github.event_name == 'pull_request' && '--profile=ci' || '' }}
        run: yarn build:core $PROFILE

      # The vorn command against its recorded output, on each platform.
      - name: Native CLI
        if: ${{ !inputs.quick }}
        run: yarn vitest run tests/native-cli.test.ts

      # Started the way the app starts it. Stdin is already closed, so it says
      # where it listens and then stops at once. The packaged app is checked
      # by native-app.yml, which builds the installers.
      - name: Built vornd runs
        if: ${{ !inputs.quick }}
        shell: bash
        working-directory: packages/core
        run: |
          x=; [ "$RUNNER_OS" = Windows ] && x=.exe
          out=$("./vornd$x" --data-dir "$RUNNER_TEMP/built-vornd" --port 0 --exit-with-stdin < /dev/null)
          echo "$out"
          case "$out" in
            '{"port":'*) ;;
            *) echo "ERROR: vornd did not say where it listens"; exit 1 ;;
          esac
          "./vorn-sessiond$x" --version
          "./vorn$x" --version
          if [ "$RUNNER_OS" = Windows ]; then
            for name in conpty.dll x64/OpenConsole.exe; do
              test -f "$name" || { echo "ERROR: $name is not beside vorn-sessiond"; exit 1; }
            done
          fi

      # Every vornd, sessiond and session program the tests above started has ended with them.
      - name: No processes left behind
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/check-leftover-processes.mjs --wait 15 "$TMPDIR" "$GITHUB_WORKSPACE"
