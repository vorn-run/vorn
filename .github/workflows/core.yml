name: Core

# Builds the Rust core (packages/core) on every desktop platform and packages
# the app with it, so a change that breaks the crate, the libghostty-vt build or
# the way the binary ships shows up before it reaches a release.

on:
  push:
    branches: [main]
    paths: &paths
      - 'packages/core/**'
      - 'packages/server/src/native-core.ts'
      - 'packages/server/src/git-runner.ts'
      - 'packages/server/src/git-utils.ts'
      - 'tests/native-core.test.ts'
      - 'tests/git-native-parity.test.ts'
      - 'packages/server/src/terminal-screen.ts'
      - 'tests/js-reference.test.ts'
      - 'tests/fixtures/js-reference/**'
      - 'tests/helpers/screen-view.ts'
      - 'tests/helpers/analysis-parity.ts'
      - 'tests/terminal-screen-memory.process.test.ts'
      - 'tests/helpers/measure-screens.ts'
      - 'tests/helpers/screen-parity.ts'
      - 'packages/server/src/core-pipeline.ts'
      - 'tests/core-pipeline.test.ts'
      - 'tests/helpers/front-door.ts'
      - 'tests/server-integration.test.ts'
      - 'tests/task-write-methods.test.ts'
      - 'tests/workflow-methods.test.ts'
      - 'scripts/conformance.mjs'
      - 'packages/server/src/vornd-channel.ts'
      - 'packages/server/src/vornd-sessions.ts'
      - 'tests/vornd-app-channel.test.ts'
      - 'tests/vornd-app-sessions.test.ts'
      - 'tests/vornd-app-platforms.test.ts'
      - 'tests/helpers/vornd-sessions.ts'
      - 'packages/server/src/database.ts'
      - 'packages/server/src/store-types.ts'
      - 'packages/shared/src/types.ts'
      - 'scripts/gen-store-schema.mjs'
      - 'tests/native-store.test.ts'
      - 'tests/helpers/store-parity.ts'
      - 'tests/database-*.test.ts'
      - 'tests/artifact-*.test.ts'
      - 'THIRD_PARTY_NOTICES.md'
      - 'electron-builder.yml'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/core.yml'
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        # macos-15, not latest: Zig 0.15.2 cannot read the newer macOS SDK's
        # libSystem and fails to link even its own build runner there.
        os: [ubuntu-latest, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      # libghostty-vt-sys builds Ghostty's VT library from source with Zig. The
      # Ghostty commit it pins refuses any Zig but 0.15.2.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      # The version comes from packages/core/rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: packages/core
        run: rustup toolchain install

      # target/ holds the Ghostty checkout and Zig's caches as well as cargo's,
      # which is most of a cold build.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/core/target
          key: core-${{ runner.os }}-${{ hashFiles('packages/core/Cargo.lock', 'packages/core/rust-toolchain.toml') }}
          restore-keys: core-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install

      - name: Rust format
        if: runner.os == 'Linux'
        working-directory: packages/core
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: packages/core
        run: cargo clippy --release --locked --workspace --all-targets -- -D warnings

      # The plain crates only: they have no napi in them, so their test binaries
      # link on every platform. The adapter crate holds no tests of its own.
      - name: Rust tests
        working-directory: packages/core
        run: cargo test --release --locked -p vorn-screen -p vorn-analysis -p vorn-pipeline -p vorn-term-mirror -p vorn-recovery -p vorn-engine -p vorn-grid -p vorn-grid-client -p vorn-size -p vorn-protocol -p vorn-store

      # The store's protocol types are generated from packages/shared; the
      # committed schema has to be the one the TypeScript gives today.
      - name: Store schema is current
        if: runner.os == 'Linux'
        run: node scripts/gen-store-schema.mjs --check

      # The git crate links nothing from napi, so it runs everywhere, and its
      # parity tests compare against the git each runner has.
      - name: Git crate tests
        working-directory: packages/core
        run: cargo test --release --locked -p vorn-git

      # The holder and recovery tests run the real vorn-sessiond and the
      # recovery harness's output program, which cargo only builds for their
      # own packages' tests. On Windows sessiond hosts its sessions in the
      # ConPTY the app ships, so the tests install it beside sessiond too.
      - name: vornd tests
        working-directory: packages/core
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            node scripts/fetch-conpty.mjs
            export VORN_CONPTY_DIR="$(cygpath -w "$PWD")"
          fi
          cargo build --release --locked -p vorn-sessiond -p vorn-recovery --bins
          cargo test --release --locked -p vornd

      # The RPC test files again, with every client going through vornd. Linux
      # only for now: the files themselves only run on Linux in the main suite.
      - name: Conformance through vornd
        if: runner.os == 'Linux'
        run: yarn test:conformance

      # The session holder and the wire types it carries: no napi, no Ghostty,
      # and the spool tests write to a temp dir on each platform.
      - name: Session holder tests
        working-directory: packages/core
        run: cargo test --release --locked -p vorn-term-proto -p vorn-sessiond-wire -p vorn-sessiond

      - name: Build vorn_core.node
        run: yarn build:core

      # The native tests skip themselves when the binary lacks an export, so a
      # default build that lost Ghostty would turn them into silent skips.
      - name: Default build exports TerminalPipeline
        shell: bash
        run: node -e "const c = require('./packages/core/vorn_core.node'); if (typeof c.TerminalPipeline !== 'function') { console.error('vorn_core.node has no TerminalPipeline'); process.exit(1) }"

      # With the binary present these run the real call from Node, including a
      # parse through libghostty-vt.
      - name: Native call
        run: yarn vitest run tests/native-core.test.ts tests/js-reference.test.ts tests/core-pipeline.test.ts tests/git-native-parity.test.ts

      # Every test that keeps data, again with the database in the native
      # store, which fails the run rather than fall back to the TypeScript one.
      - name: Native store
        shell: bash
        env:
          VORN_NATIVE_STORE: '1'
        run: yarn vitest run tests/native-store.test.ts $(grep -l -E 'initTestDatabase|initDatabase' tests/*.test.ts tests/*.test.tsx 2>/dev/null)

      - name: Conformance through vornd, native store
        if: runner.os == 'Linux'
        env:
          VORN_NATIVE_STORE: '1'
        run: yarn test:conformance

      # The server driving its sessions through the real vornd and session
      # holder, on each platform: a named pipe and ConPTY on Windows.
      - name: Sessions through vornd
        shell: bash
        run: |
          export VORN_CONFORMANCE_VORND="$(pwd -W 2>/dev/null || pwd)/packages/core/vornd$([ "$RUNNER_OS" = Windows ] && echo .exe)"
          yarn vitest run tests/vornd-app-platforms.test.ts

      # The screen model's memory ceiling and release. One platform is enough
      # for a ceiling.
      - name: Native screen memory
        if: runner.os == 'Linux'
        run: yarn vitest run tests/terminal-screen-memory.process.test.ts

      - name: Build app
        run: yarn build

      # Unsigned and not notarized: this checks that the app packages with the
      # core in it, not that it is ready to publish.
      - name: Package app
        # bash on Windows too: PowerShell splits -c.mac.notarize=false at the dot.
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: yarn dist --publish never -c.mac.notarize=false

      - name: Packaged core loads
        shell: bash
        run: |
          # -ipath: the mac app keeps it under Contents/Resources.
          file=$(find dist -ipath '*/resources/core/vorn_core.node' -print -quit)
          if [ -z "$file" ]; then
            echo "ERROR: vorn_core.node is not in the packaged resources"
            exit 1
          fi
          echo "found $file"
          node -e "
            const m = { exports: {} };
            process.dlopen(m, process.argv[1]);
            console.log(m.exports.hello('ci'), m.exports.info());
          " "$file"

      # Started the way the app starts it. Stdin is already closed, so it says
      # where it listens and then stops at once.
      - name: Packaged vornd runs
        shell: bash
        run: |
          file=$(find dist -ipath '*/resources/vornd/vornd*' -type f -print -quit)
          if [ -z "$file" ]; then
            echo "ERROR: vornd is not in the packaged resources"
            exit 1
          fi
          echo "found $file"
          out=$("$file" --upstream 127.0.0.1:9 --exit-with-stdin < /dev/null)
          echo "$out"
          case "$out" in
            '{"port":'*) ;;
            *) echo "ERROR: vornd did not say where it listens"; exit 1 ;;
          esac
          sessiond=$(find dist -ipath '*/resources/vornd/vorn-sessiond*' -type f -print -quit)
          if [ -z "$sessiond" ]; then
            echo "ERROR: vorn-sessiond is not in the packaged resources"
            exit 1
          fi
          echo "found $sessiond"
          "$sessiond" --version
          if [ "$RUNNER_OS" = Windows ]; then
            for name in conpty.dll x64/OpenConsole.exe; do
              file=$(find dist -ipath "*/resources/vornd/$name" -type f -print -quit)
              if [ -z "$file" ]; then
                echo "ERROR: $name is not beside vorn-sessiond in the packaged resources"
                exit 1
              fi
              echo "found $file"
            done
          fi
