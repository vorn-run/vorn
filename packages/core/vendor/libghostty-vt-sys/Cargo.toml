# libghostty-rs 3ddcb10's sys crate without its bindings' doc comments, plus the program status (OSC 7501) types; build.rs pins Ghostty b7207b2 for OSC 7501 revision 0.4.
[package]
name = "libghostty-vt-sys"
description = "Raw FFI bindings for libghostty-vt, the Ghostty terminal emulation library"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uzaaft/libghostty-rs"
rust-version = "1.90"
links = "ghostty-vt"
build = "build.rs"
publish = false

[lib]
doctest = false

[features]
default = ["vendored"]
vendored = []
pkg-config = ["dep:pkg-config"]
link-dynamic = []
kitty-graphics = []

[build-dependencies]
pkg-config = { version = "0.3", optional = true }
