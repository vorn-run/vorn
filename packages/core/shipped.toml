# The extensions the installer carries so a first launch works offline,
# installed like any other. Each is pinned to its released pack's version
# and sha256; vornd's build embeds `<id>-<version>.vorn.tgz` from
# $VORN_SHIPPED_DIR (else packages/core/shipped/), and scripts/shipped.mjs
# fetches the packs vorn-run/extensions' CI built at `rev`.
