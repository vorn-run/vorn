[package]
name = "vorn-bench-ext-tiers"
version = "0.1.0"
edition = "2021"
publish = false
description = "E9.4: the same extensions as built-ins, programs and Wasm components, measured side by side"

[[bin]]
name = "ext-tiers"
path = "src/main.rs"

[dependencies]
ext-tiers-logic = { path = "logic" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# The compiler too: the bench precompiles the components vornd only loads.
vorn-extensions = { path = "../../crates/extensions", features = ["wasm-compile"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
