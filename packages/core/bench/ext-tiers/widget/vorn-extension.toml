id = "bench.widget"
name = "Widget"
version = "0.9.0"
api = "vorn:extension@1.0"
description = "A small window over the others: every agent's status, and Allow or Deny for the tools they ask to use."

[declares]
uses = ["sessions.read", "agent.permissions"]

[service]
component = "widget.wasm"
events = ["session.created", "session.status", "session.exited", "agent.permission", "agent.permissionClosed"]

[[contributes.windows]]
id = "widget"
title = "Vorn"
tree = true
size = [280, 400]
raise = "permissions"

[[contributes.windows]]
id = "compact"
title = "Vorn"
tree = true
size = [296, 84]

[[contributes.commands]]
id = "toggle"
title = "Toggle Widget"
key = "Mod+Alt+W"
window = "widget"
icon = "panel-top"
