[package]
name = "vorn-scale-bench"
version.workspace = true
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Measures the session holder and vornd with hundreds to tens of thousands of sessions: memory, threads, descriptors, echo latency, throughput, spawn, attach and handoff"

[[bin]]
name = "vorn-scale-bench"
path = "src/main.rs"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "process"] }
tokio-tungstenite = "0.28"
vorn-grid-client = { path = "../../crates/grid-client" }
vorn-sessiond-wire = { path = "../../crates/sessiond-wire" }
vorn-term-proto = { path = "../../crates/term-proto" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
