# Vorn's light theme: the dark theme's hierarchy on a warm paper white.
# Licence: MIT, part of Vorn.
id = "vorn-light"
name = "Vorn Light"
version = "1.0.0"
api = "vorn:extension@0.9"
publisher = "Vorn"
description = "Vorn's own light theme."

[theme]
appearance = "light"

[theme.ui]
surface-base = "#f7f7f5"
surface-panel = "#f0f0ed"
surface-sunken = "#ffffff"
surface-overlay = "#ffffff"
ink = "#1b1b1d"
ink-bright = "#000000"
ink-secondary = "#0000008c"
ink-faint = "#00000066"
ink-ghost = "#00000033"
line-faint = "#0000000d"
line-soft = "#00000012"
line-base = "#00000017"
line-strong = "#0000001f"
line-hover = "#00000026"
accent = "#8f6612"
accent-strong = "#7d5810"
danger = "#b8461f"
status-slate = "#5f6875"
status-blue = "#46688c"
status-sage = "#52704a"
diff-add = "#3f7a2a"
diff-remove = "#b4473a"
selection = "#3390ff40"
focus-ring = "#00000073"
scroll-thumb = "#0000001a"
scroll-thumb-hover = "#00000040"
shadow = "#000000"
gray-100 = "#1f2329"
gray-200 = "#2b3038"
gray-300 = "#3d4450"
gray-400 = "#5d6675"
gray-500 = "#737c8a"
gray-600 = "#a3abb8"
gray-700 = "#c5cbd3"
gray-800 = "#dde1e6"
gray-900 = "#eceef1"

[theme.terminal]
foreground = "#1f2329"
background = "#ffffff"
cursor = "#1f2329"
selection = "#d6dbe3"
ansi = [
  "#1f2329", "#c4314b", "#2e7d32", "#9a6700", "#1f5fbf", "#8e3fb0", "#0f7b8a", "#8a8f98",
  "#4b5563", "#d23f57", "#388e3c", "#b07b00", "#2b6fd6", "#a04cc4", "#13899a", "#c4c8ce",
]
