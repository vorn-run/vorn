id = "nord"
name = "Nord"
version = "1.0.0"
api = "vorn:extension@0.9"
publisher = "Vorn"
description = "An arctic, north-bluish palette, by Sven Greb."

[theme]
appearance = "dark"

[theme.ui]
surface-base = "#2e3440"
surface-panel = "#2b303b"
surface-sunken = "#3b4252"
surface-overlay = "#434c5e"
ink = "#d8dee9"
ink-bright = "#eceff4"
accent = "#88c0d0"
danger = "#bf616a"

[theme.terminal]
foreground = "#d8dee9"
background = "#2e3440"
cursor = "#d8dee9"
selection = "#434c5e"
ansi = [
  "#3b4252", "#bf616a", "#a3be8c", "#ebcb8b", "#81a1c1", "#b48ead", "#88c0d0", "#e5e9f0",
  "#4c566a", "#bf616a", "#a3be8c", "#ebcb8b", "#81a1c1", "#b48ead", "#8fbcbb", "#eceff4",
]
