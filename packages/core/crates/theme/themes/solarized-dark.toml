id = "solarized-dark"
name = "Solarized Dark"
version = "1.0.0"
api = "vorn:extension@0.9"
publisher = "Vorn"
description = "Solarized's dark palette, by Ethan Schoonover."

[theme]
appearance = "dark"

[theme.ui]
surface-base = "#002b36"
surface-panel = "#01303c"
surface-sunken = "#073642"
surface-overlay = "#0a3f4c"
ink = "#93a1a1"
ink-bright = "#eee8d5"
accent = "#b58900"
danger = "#dc322f"

[theme.terminal]
foreground = "#839496"
background = "#002b36"
cursor = "#93a1a1"
selection = "#073642"
ansi = [
  "#073642", "#dc322f", "#859900", "#b58900", "#268bd2", "#d33682", "#2aa198", "#eee8d5",
  "#002b36", "#cb4b16", "#586e75", "#657b83", "#839496", "#6c71c4", "#93a1a1", "#fdf6e3",
]
