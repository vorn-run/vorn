# Vorn's dark theme: today's look, every token written out.
# Licence: MIT, part of Vorn.
id = "vorn-dark"
name = "Vorn Dark"
version = "1.0.0"
api = "vorn:extension@0.9"
publisher = "Vorn"
description = "Vorn's own dark theme."

[theme]
appearance = "dark"

