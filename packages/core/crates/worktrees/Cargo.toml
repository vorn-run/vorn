[package]
name = "vorn-worktrees"
# Never published and never versioned on its own; vorn-core carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "The worktree manager's inventory and cleanup: what each worktree holds, whether it is safe to remove, and the removal"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
vorn-git = { path = "../vorn-git" }

[dev-dependencies]
tempfile = "3"
