[package]
name = "vornui"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Vorn's thin UI layer: winit windows, wgpu or CPU drawing, cosmic-text and swash text, taffy layout, AccessKit accessibility, and the widgets the app is built from"

[dependencies]
wgpu = { version = "29", default-features = false, features = ["wgsl", "std"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
accesskit = "0.25"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
# std's clock on a desktop; the page's `performance.now()` in a browser.
web-time = "1"
taffy = { version = "0.10", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
etagere = "0.2"
resvg = { version = "0.48", default-features = false }
png = "0.18"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
unicode-segmentation = "1"
rayon = "1"
unicode-width = "0.2"

# The desktop window (window.rs): the system clipboard, a pixel buffer, the
# accessibility adapter, system fonts and a terminal. A browser has none of them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "29", default-features = false, features = ["wgsl", "metal", "dx12", "vulkan", "std"] }
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash", "fontconfig"] }
arboard = { version = "3", default-features = false }
softbuffer = { version = "0.4", default-features = false }
# The Cells backend's terminal: raw mode, diffed writes and input.
crossterm = "0.29"
vorn-spawn = { path = "../spawn" }

# In a browser wgpu draws through WebGPU, or WebGL2 where there is none (web.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["wgsl", "std", "webgpu", "webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
raw-window-handle = "0.6"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlTextAreaElement",
  "CssStyleDeclaration", "CanvasRenderingContext2d", "ImageData", "Navigator", "Clipboard",
  "ClipboardEvent", "DataTransfer", "KeyboardEvent", "InputEvent", "CompositionEvent", "Event",
  "EventTarget", "MouseEvent", "Node", "DomRect", "ResizeObserver", "ResizeObserverEntry",
  "ResizeObserverSize", "ResizeObserverOptions", "ResizeObserverBoxOptions", "MediaQueryList",
  "console", "Location", "UrlSearchParams", "Text", "DragEvent", "File", "FileList", "Blob",
] }

# Linux has no single window system: X11 and Wayland are both loaded at run
# time, and the screen reader is reached over D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06", "accesskit_unix", "async-io"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }

# The traffic lights' place, image drops and the clipboard's image, through
# the AppKit bindings winit already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSButton", "NSControl", "NSDragging", "NSImage", "NSImageRep", "NSPasteboard", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSGeometry", "NSString"] }

# The CPU raster raises its threads' priority (see cpu.rs); the clipboard's
# image and where a drop landed (window.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "raster"
harness = false
