[package]
name = "vornui"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Vorn's thin UI layer: winit windows, wgpu or CPU drawing, cosmic-text and swash text, taffy layout, AccessKit accessibility, and the widgets the app is built from"

[dependencies]
wgpu = { version = "29", default-features = false, features = ["wgsl", "metal", "dx12", "vulkan", "std"] }
accesskit = "0.25"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash", "fontconfig"] }
taffy = { version = "0.10", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
etagere = "0.2"
resvg = { version = "0.48", default-features = false }
png = "0.18"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
unicode-segmentation = "1"
rayon = "1"
unicode-width = "0.2"

# A window, a clipboard and a terminal exist only off WASI: a UI component drawn by a host links the rest.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
arboard = { version = "3", default-features = false }
crossterm = "0.29"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }

# Linux has no single window system: X11 and Wayland are both loaded at run
# time, and the screen reader is reached over D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06", "accesskit_unix", "async-io"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }

# The traffic lights' place, through the AppKit bindings winit already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["std", "NSGeometry"] }

# The CPU raster raises its threads' priority (see cpu.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "raster"
harness = false
