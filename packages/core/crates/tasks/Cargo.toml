[package]
name = "vorn-tasks"
# Never published and never versioned on its own; the workspace carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "The Tasks built-in for Vorn: the board's writes, its images and triggers, connector imports, the MCP task tools, the card badge and the board's template, on the public extension API"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# A write's answer handed back from the thread that ran it.
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
# Event names, the row ops it publishes and the manifest it is held to.
vorn-extensions = { path = "../extensions" }
# The tools it adds to Vorn's MCP server are written with the server's own toolkit.
vorn-mcp = { path = "../mcp" }
vorn-store = { path = "../store" }
# The truthiness and number formatting the board's rules use.
vorn-work = { path = "../work" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
