id = "tracker"
name = "Tracker links"
version = "1.4.2"
api = "vorn:extension@1.0"

[service]
command = ["node", "index.js"]

[declares]
uses = ["git.read", "terminal.selection", "card.rename"]

[connector]

[activates]
remote_host = ["github.com"]
platform = ["darwin", "linux"]

[[contributes.panes]]
id = "issue"
title = "Issue"
description = "The issue a link names"
web = "web/issue.html"
icon = { view_box = "0 0 24 24", paths = ["M4 4h16v16H4z"] }

[[contributes.link_handlers]]
id = "issue"
title = "Open the issue"
pattern = 'PROJ-\d+'
example = "PROJ-12"
