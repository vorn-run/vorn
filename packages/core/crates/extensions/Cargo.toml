[package]
name = "vorn-extensions"
# Never published and never versioned on its own; vorn-core carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Extensions for Vorn: installed packs, where their contributions show, the child each runs as per project, and the channel it talks back on"

[dependencies]
data-encoding = "2"
getrandom = "0.4"
# Link handler patterns are JavaScript regular expressions, matched as a browser would.
regress = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "process", "io-util", "sync", "time", "macros"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
# SIGTERM for a child that does not leave when its stdin closes.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
