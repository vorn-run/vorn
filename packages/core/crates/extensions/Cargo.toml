[package]
name = "vorn-extensions"
# Never published and never versioned on its own; the workspace carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Extensions for Vorn: the one manifest and package store, the extension API generated from its WIT, the lifecycle every program runs under, the router and gate between programs and Vorn, and installing from git"


[dependencies]
vorn-spawn = { path = "../spawn", features = ["tokio"] }
data-encoding = "2"
getrandom = "0.4"
# `vorn ext pack` bundles a folder as a .tar.gz; both already in the tree.
flate2 = "1"
tar = { version = "0.4", default-features = false }
# Link handler patterns are JavaScript regular expressions, matched as a browser would.
regress = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# vorn-extension.toml is TOML a person writes; 1.x reports the span of every key, so errors name their line. Already in the tree.
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std", "display"] }
tokio = { version = "1", features = ["rt", "process", "io-util", "sync", "time", "macros", "net"] }
tracing = "0.1"
# An [agent] section is checked against the adapter format it reads as.
vorn-agents = { path = "../agents" }
# The shipped set's versions are compared to decide what an update replaces; already in the tree.
semver = "1"
# A pack Vorn ships or the catalog lists is admitted by its pinned checksum; already in the tree.
sha2 = { version = "0.10", default-features = false }
# A [theme] section is checked as the app reads it.
vorn-theme = { path = "../theme" }

# Services as sandboxed Wasm components: Wasmtime's runtime and component
# model, and WASI preview 2 with nothing granted. The compiler is a separate
# feature that only the vorn command turns on, so vornd runs only components
# Vorn already compiled into its cache.
wasmtime = { version = "=49.0.3", optional = true, default-features = false, features = ["runtime", "component-model", "std"] }
wasmtime-wasi = { version = "=49.0.3", optional = true, default-features = false, features = ["p2"] }

[features]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]
wasm-compile = ["wasm", "wasmtime/cranelift"]

[target.'cfg(unix)'.dependencies]
# SIGTERM for a child that does not leave when its stdin closes.
libc = "0.2"
# files.* opens each folder in the one before without following a link (openat); already in the tree.
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# files.* checks the path and link count of the file it opened; already in the tree.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# The Wasm tests compile their component in process.
vorn-extensions = { path = ".", features = ["wasm-compile"] }
# Builds the test component for wasm32-wasip2.
vorn-guest-build = { path = "../guest-build" }
# Reads the trees a component draws.
vorn-tree = { path = "../tree" }
criterion = { version = "0.5", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "test-util"] }

[[bench]]
name = "events"
harness = false
