[package]
name = "vorn-hooks"
# Never published and never versioned on its own; vorn-core carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Agents' hooks: the events they post, which terminal each comes from, the settings that register them, and the conversation an agent took"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
