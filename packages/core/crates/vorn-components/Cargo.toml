[package]
name = "vorn-components"
version.workspace = true
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Vorn's composed components (agent and status icons, session card chrome, the session dock), built only from vornui's primitives"

[dependencies]
vornui = { path = "../vornui" }
# Extension templates, drawn by `template`.
vorn-view = { path = "../view" }
# Extension element trees, drawn by `tree`.
vorn-tree = { path = "../tree" }

[dev-dependencies]
# Templates and rows, written as clients receive them.
serde_json = "1"
vorn-view = { path = "../view", features = ["kdl"] }

[[example]]
name = "gallery"
