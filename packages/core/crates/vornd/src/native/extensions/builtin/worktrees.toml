id = "vorn.worktrees"
name = "Worktree cleanup"
version = "0.9.0"
api = "vorn:extension@0.9"
description = "Offers to remove a worktree once its last session ends, and lists every worktree with what removing it frees."

[declares]
uses = ["git.read", "git.write", "sessions.launch"]

[[contributes.sidebar]]
id = "idle"
title = "Idle worktrees"
view = "views/idle.kdl"

[[contributes.menus]]
id = "remove"
title = "Remove Worktree…"
menu = "worktree"
call = "ask"
icon = "trash-2"

[[contributes.dialogs]]
id = "confirm"
title = "Remove Worktree"
view = "views/confirm.kdl"

[[contributes.settings]]
id = "worktrees"
title = "Worktrees"
icon = "git-branch"
view = "views/settings.kdl"
call = "scan"
