[package]
name = "vornd"
version.workspace = true
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Vorn's server: the endpoint every client uses, its session holder and every call"

[[bin]]
name = "vornd"
path = "src/main.rs"

[features]
default = ["engine"]
# The session engine parses every session's output with libghostty-vt, which
# Zig 0.16.0 builds from source. Without it vornd only keeps the holder.
engine = ["dep:vorn-engine"]

[dependencies]
vorn-spawn = { path = "../spawn", features = ["tokio"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
# Connector MCP servers are spoken to through the official Rust SDK, as a client
# of a child on stdio.
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
# Key order kept, so an answer vornd frames reads as the server's does.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal", "io-util", "process", "fs"] }
tokio-tungstenite = "0.28"
tracing = "0.1"
vorn-logfile = { path = "../logfile" }
vorn-sessiond = { path = "../sessiond" }
vorn-sessiond-wire = { path = "../sessiond-wire" }
vorn-engine = { path = "../engine", optional = true }
vorn-size = { path = "../size" }
vorn-agents = { path = "../agents" }
vorn-git = { path = "../vorn-git" }
vorn-extensions = { path = "../extensions" }
vorn-store = { path = "../store" }
vorn-vault = { path = "../vault" }
vorn-connectors = { path = "../connectors" }
url = "2"
vorn-mcp = { path = "../mcp" }
vorn-protocol = { path = "../protocol" }
vorn-reach = { path = "../reach" }
vorn-term-proto = { path = "../term-proto" }
vorn-work = { path = "../work" }
# The workflow engine, which vornd hosts.
vorn-workflow = { path = "../workflow" }
# The system's time zone, which a schedule without one fires in.
jiff = "0.2"
vorn-worktrees = { path = "../worktrees" }
vorn-remote = { path = "../remote" }
vorn-hooks = { path = "../hooks" }
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }

# The machine's boot time, read once as vornd starts.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
# What the /mcp test posts with.
hyper = { version = "1", features = ["client"] }
hyper-util = { version = "0.1", features = ["client-legacy"] }
libghostty-vt.workspace = true
tempfile = "3"
vorn-grid-client = { path = "../grid-client" }
vorn-pipeline = { path = "../pipeline" }
vorn-recovery = { path = "../recovery" }
vorn-screen = { path = "../screen" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util", "test-util"] }
