[package]
name = "vorn-grid"
version = "0.7.5"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Grid mode's server half: the row cache, revisions, style and link tables, scrollback line numbers and per-attachment credits that turn a libghostty-vt terminal into snapshots and deltas"

[dependencies]
libghostty-vt = { version = "0.2.2", default-features = false }
vorn-screen = { path = "../screen" }
vorn-term-proto = { path = "../term-proto" }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
vorn-recovery = { path = "../recovery" }

[[bench]]
name = "encode"
harness = false
