[package]
name = "vorn-term-proto"
version = "0.7.5"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Terminal wire types shared by vorn-sessiond, vornd and their clients: record positions, the screen mirror's rows and the row cell encoding"

[features]
# Derives for the wire: vorn-sessiond encodes records with postcard.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
