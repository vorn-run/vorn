[package]
name = "vorn-app"
version.workspace = true
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Vorn's desktop app: the main screen on vornui, live from vornd"

[[bin]]
name = "vorn-app"
path = "src/main.rs"

[features]
default = ["webview"]
# The browser pane's OS web views; without them the terminal UI builds with no GTK.
webview = ["dep:wry", "dep:gtk"]

[dev-dependencies]
# Builds the example extensions' Wasm components the tests link.
vorn-guest-build = { path = "../guest-build" }
# The board bench writes its tasks straight into vornd's database.
vorn-store = { path = "../store" }
# A certificate for the pinned socket's test to be served with.
vorn-reach = { path = "../reach", features = ["mint"] }

[build-dependencies]
# The app icon in vorn-app.exe, for Explorer, the taskbar and the installer.
embed-resource = "3"

[dependencies]
# The UI layer, reached only through `src/ui.rs`.
vornui = { path = "../vornui" }
# The composed components the screens are built from.
vorn-components = { path = "../vorn-components" }
# Extension templates and their rows, checked as vornd sends them.
# Extension pages drawn from element trees.
vorn-tree = { path = "../tree" }
vorn-protocol = { path = "../protocol" }
vorn-grid-client = { path = "../grid-client" }
vorn-term-mirror = { path = "../term-mirror" }
vorn-term-proto = { path = "../term-proto" }
# Workflow files: the portable format the editor exports and imports.
vorn-mcp = { path = "../mcp" }
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The address bar parses as the renderer's WHATWG `URL` does.
url = "2"
sha2 = "0.10"
semver = "1"
# std's clock on a desktop; the page's `performance.now()` in a browser.
web-time = "1"

# A desktop's: vornd over a local socket, child processes, the OS web view
# for the browser pane and the updater.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vorn-spawn = { path = "../spawn" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "macros", "time"] }
tokio-tungstenite = "0.28"
# A phone's socket to vornd over TLS, pinned to the certificate it paired with.
vorn-reach = { path = "../reach", features = ["tls"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The browser pane: the OS web view (WKWebView, WebView2, WebKitGTK).
wry = { version = "0.57", optional = true }
# The updater: the release feed, the download and its checksum.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

# A browser's: vornd over the page's WebSockets, and the page's own clipboard,
# storage, notifications, file pickers and tabs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# The workflow ids vorn-mcp makes, from the page's crypto.
uuid = { version = "1", features = ["js"] }
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement",
  "FileList", "File", "Blob", "BlobPropertyBag", "Url", "Location", "Storage", "WebSocket",
  "MessageEvent", "CloseEvent", "BinaryType", "Event", "Notification", "NotificationOptions",
  "NotificationPermission", "Navigator", "console", "Request", "RequestInit", "Response", "Headers",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# The UI layer turns winit's defaults off; a Linux window needs a display
# server, so the app asks for both.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
# WebKitGTK runs on GTK's loop, which the window pumps between frames.
gtk = { version = "0.18", optional = true }
# The approve and deny keys, grabbed on the X11 root window.
x11rb = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Whether a WKWebView is still loading, which wry does not say.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }
