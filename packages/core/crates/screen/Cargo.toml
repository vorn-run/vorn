[package]
name = "vorn-screen"
version = "0.7.5"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "A terminal's screen on libghostty-vt: feed bytes, read title and cwd, serialize for a checkpoint"

[dependencies]
crc32fast = "1"
libghostty-vt.workspace = true
memchr = "2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
vorn-recovery = { path = "../recovery" }
vorn-term-proto = { path = "../term-proto" }

[[bench]]
name = "screen"
harness = false

[[bench]]
name = "corpora"
harness = false
