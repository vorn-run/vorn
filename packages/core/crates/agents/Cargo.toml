[package]
name = "vorn-agents"
# Never published and never versioned on its own; vorn-core carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "What Vorn reads about the coding agents without starting one: which are installed, their past sessions and their models"

[dependencies]
# Local time for the dates an agent records without an offset, as `new Date` reads them.
jiff = "0.2"
# The agents keep their sessions in SQLite files of their own, read here read-only.
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
