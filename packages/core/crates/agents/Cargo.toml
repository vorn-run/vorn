[package]
name = "vorn-agents"
# Never published and never versioned on its own; the workspace carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "What Vorn reads about the coding agents without starting one: which are installed, their past sessions and their models"

[dependencies]
vorn-spawn = { path = "../spawn" }
# The screen rules each agent's status is read with.
vorn-analysis = { path = "../analysis" }
# Local time for the dates an agent records without an offset, as `new Date` reads them.
jiff = "0.2"
# The agents keep their sessions in SQLite files of their own, read here read-only.
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
# PowerShell's integration rides its command line in base64.
data-encoding = "2"

[target.'cfg(unix)'.dependencies]
# getuid, for the shim directory's owner.
libc = "0.2"

[dev-dependencies]
# Pins the shims to the versions the server wrote.
sha2 = { version = "0.10", default-features = false }
tempfile = "3"
# Status fixtures: rule files read against recorded screens.
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse"] }
vorn-recovery = { path = "../recovery" }
vorn-screen = { path = "../screen" }
vorn-term-proto = { path = "../term-proto" }
