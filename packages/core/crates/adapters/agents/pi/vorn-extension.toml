# Pi, run from its adapter. Written from the CLI's own source (its argument
# parser and session manager); only what could be checked there is here.
id = "vorn.agents.pi"
name = "Pi"
version = "0.9.0"
api = "vorn:extension@0.9"
description = "Runs the Pi coding agent: launches it, resumes a session by id and runs it headless."

[agent]
id = "pi"
name = "Pi"
description = "Pi coding agent CLI"
icon = "icon.svg"
mark = "π"
color = "#9d8cf2"
tint = "#9d8cf220"
url = "https://pi.dev"
install = "npm install -g --ignore-scripts @earendil-works/pi-coding-agent"

[agent.launch]
command = "pi"

# `--session <id>` opens that session; `--session-id <id>` starts one under an id chosen beforehand.
[agent.resume]
args = ["--session", "{id}"]
pin = ["--session-id", "{id}"]
selectors = { with_value = ["--session", "--session-id", "--fork"], bare = ["--continue", "-c", "--resume", "-r"] }

# Print mode reads piped stdin in front of its first message.
[agent.headless]
prompt = ["-p"]
no_prompt = ["-p", ""]
resume = ["--session", "{id}"]

[agent.models]
