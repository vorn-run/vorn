# GitHub Copilot CLI, run from its adapter, with its own footer on each card.
id = "vorn.agents.copilot"
name = "GitHub Copilot"
version = "0.9.0"
api = "vorn:extension@0.9"
description = "Runs GitHub Copilot CLI: launches and resumes it, lists its models, reads its status and hooks, and shows its model on each card."

[agent]
id = "copilot"
name = "GitHub Copilot"
label = "GitHub Copilot"
short_name = "Copilot"
description = "GitHub Copilot CLI"
icon = "icon.svg"
mark = "◉"
color = "#6cc644"
tint = "#6cc64420"
url = "https://docs.github.com/en/copilot/using-github-copilot/using-github-copilot-agent-mode"
install = "brew install copilot-cli"

[agent.launch]
command = "copilot"
headless_args = ["--allow-all"]
prompt = ["-i", "{prompt}"]

[agent.resume]
args = ["--resume", "{id}"]
pin = ["--session-id", "{id}"]
selectors = { with_value = ["--resume", "--session-id"] }

[agent.headless]
prompt = []
no_prompt = ["-p", ""]
resume = ["--resume", "{id}"]

[agent.models]
selectors = ["-m"]

[agent.models.list]
args = ["--acp", "--no-remote", "--no-remote-export"]

[[agent.models.list.steps]]
send = [{ jsonrpc = "2.0", id = 1, method = "initialize", params = { protocolVersion = 1, clientCapabilities = { fs = { readTextFile = false, writeTextFile = false } } } }]
reply = { id = "{id}" }
fail = "error"

[[agent.models.list.steps]]
send = [{ jsonrpc = "2.0", id = 2, method = "session/new", params = { cwd = "{cwd}", mcpServers = [] } }]
reply = { id = "{id}" }
fail = "error"
models = "result.models.availableModels"

[agent.models.list.choice]
id = ["modelId"]
description = ["{_meta.copilotUsage} usage", "description"]
skip = [
  { path = "hidden", is = true },
  { path = "policy.state", is = "disabled" },
  { path = "_meta.copilotEnablement", is_not = "enabled" },
]

[agent.history]
rank = 3
activity = "turn"
title_limit = 80

[agent.history.sqlite]
db = "~/.copilot/session-store.db"
query = "SELECT s.id, s.cwd, s.summary, s.updated_at, COUNT(t.id) as turn_count FROM sessions s LEFT JOIN turns t ON s.id = t.session_id WHERE {scope} GROUP BY s.id ORDER BY s.updated_at DESC"
scope = "s.cwd"
id = "id"
project = "cwd"
title = ["summary"]
time = "updated_at"
unit = "date"
count = "turn_count"

[agent.hooks.file]
path = "{env:COPILOT_HOME|~/.copilot}/hooks/vorn.json"
session = "copilot-{terminal}"
events = [
  ["sessionStart", "SessionStart"],
  ["sessionEnd", "SessionEnd"],
  ["userPromptSubmitted", "Notification"],
  ["preToolUse", "PreToolUse"],
  ["postToolUse", "PostToolUse"],
  ["errorOccurred", "PostToolUseFailure"],
]

[agent.mcp]
commands = ["copilot plugin marketplace add vorn-run/plugin", "copilot plugin install vorn@vorn"]

# A permission prompt: a command, an edit or a tool, as a numbered menu.
[[agent.status]]
status = "waiting"
rows = [-24, -1]
any = [
  'Do you want to (run|edit|create|allow|use)',
  '^[\s│]*❯\s*\d+\.\s',
  'No, and tell .* what to do differently',
]

# A turn in progress: the spinner's line offers to cancel it.
[[agent.status]]
status = "working"
rows = [-12, -1]
any = ['(?i)\besc to (cancel|interrupt)\b']

# The input box, empty or being typed in.
[[agent.status]]
status = "idle"
rows = [-8, -1]
any = ['@ to mention files', '^[\s│]*>(\s|$)', '\? for shortcuts']

[declares]
uses = ["sessions.read"]

[[contributes.card_footers]]
id = "model"
view = "views/footer.kdl"
when = { agent = ["copilot"] }
