[package]
name = "vorn-adapters"
# Never published and never versioned on its own; the workspace carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "The agent adapters Vorn ships: one extension package per agent CLI, each a manifest with an [agent] section and its files"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
vorn-agents = { path = "../agents" }
vorn-analysis = { path = "../analysis" }
vorn-extensions = { path = "../extensions" }
vorn-hooks = { path = "../hooks" }
vorn-recovery = { path = "../recovery" }
vorn-screen = { path = "../screen" }
vorn-term-proto = { path = "../term-proto" }
