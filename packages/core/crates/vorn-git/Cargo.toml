[package]
name = "vorn-git"
# Never published and never versioned on its own; vorn-core carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Git for Vorn's server, off its event loop: gix for what it answers exactly as git would, git itself for the rest"

[dependencies]
gix = { version = "0.88", default-features = false, features = ["sha1"] }
# Worktree ids and generated names, from a random UUID as the server takes them.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
