[package]
name = "vorn-engine"
version = "0.7.5"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "vornd's session engine: one actor per session on a fixed worker pool, parsing sessiond's records, cutting checkpoints and recovering from them"

[dependencies]
crc32fast = "1"
libghostty-vt.workspace = true
vorn-analysis = { path = "../analysis" }
vorn-grid = { path = "../grid" }
vorn-pipeline = { path = "../pipeline" }
vorn-screen = { path = "../screen" }
vorn-sessiond-wire = { path = "../sessiond-wire" }
vorn-term-proto = { path = "../term-proto" }

[dev-dependencies]
postcard = { version = "1", default-features = false, features = ["use-std"] }
tempfile = "3"
vorn-grid-client = { path = "../grid-client" }
vorn-recovery = { path = "../recovery" }
vorn-sessiond = { path = "../sessiond" }
vorn-term-mirror = { path = "../term-mirror" }
