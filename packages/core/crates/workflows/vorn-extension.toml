id = "vorn.workflows"
name = "Workflow steps and triggers"
version = "0.9.0"
api = "vorn:extension@0.9"
publisher = "Vorn"
description = "The steps and triggers workflows are built from: agents, scripts and HTTP requests; manual runs, schedules, webhooks and a session coming back. Off, a workflow stops at those steps and its schedules and webhooks do not fire; the workflows are kept."

[declares]
uses = ["tasks.read", "tasks.write", "sessions.read", "sessions.launch", "workflows.read", "workflows.write"]

[[contributes.nodes]]
id = "launchAgent"
title = "Agent"
icon = "play"
category = "steps"

[[contributes.nodes]]
id = "script"
title = "Script"
icon = "terminal"
category = "steps"

[[contributes.nodes]]
id = "httpRequest"
title = "HTTP request"
icon = "globe"
category = "steps"

[[contributes.triggers]]
id = "manual"
title = "Manual"
icon = "zap"

[[contributes.triggers]]
id = "recurring"
title = "Recurring schedule"
icon = "clock"
timing = "cron"

[[contributes.triggers]]
id = "once"
title = "Schedule once"
icon = "calendar"
timing = "once"

[[contributes.triggers]]
id = "sessionRestored"
title = "Session restored"
icon = "rotate-ccw"

[[contributes.triggers]]
id = "webhook"
title = "Webhook"
icon = "globe"
timing = "webhook"

[[contributes.workflows]]
id = "default-task-workflow"
title = "Default Task Workflow"
description = "An agent picks up a task moved to In Progress."
file = "workflows/default-task.kdl"

[[contributes.workflows]]
id = "dev-server-on-restore"
title = "Bring the dev server back"
description = "The dev server comes back with its session; off until you turn it on."
file = "workflows/dev-server.kdl"
