id = "vorn.workflows"
name = "Workflows"
version = "1.0.0"
api = "vorn:extension@1.0"
publisher = "Vorn"
description = "Workflows: the view with their runs and the editor, where each step is a card on a canvas; the steps and triggers they are built from (agents, scripts and HTTP requests; manual runs, schedules, webhooks and a session coming back); Run workflow in the grid's, a card's and a terminal's menus; and approval gates waiting for you beside agents asking."

[icon]
view_box = "0 0 24 24"
paths = ["M3 3h7v7H3z", "M14 14h7v7h-7z", "M5.5 10h2v4.5H14v2H5.5z"]

[declares]
uses = ["tasks.read", "tasks.write", "sessions.read", "sessions.launch", "workflows.read", "workflows.write", "process.run"]

[service]
component = "workflows.wasm"
# Publishes the view's rows and the gates waiting as Vorn starts.
start = "refresh"
events = ["workflow.changed", "workflow.gates"]

[[contributes.views]]
id = "workflows"
title = "Workflows"
description = "Workflows, their runs, and the editor where each step is a card on a canvas."
icon = "workflow"
key = "Mod+Shift+W"
tree = true
button = { setting = ["top_bar"] }

[[contributes.preferences]]
id = "top_bar"
title = "Show in the top bar"
description = "Shows the Workflows button in the top bar. Off, Workflows still opens from its key and the command palette."
type = "bool"
default = true

[[contributes.menus]]
id = "run"
title = "Run workflow"
menu = "grid"
icon = "workflow"
rows = "manual"
call = "run"

[[contributes.menus]]
id = "run-on-card"
title = "Run workflow"
menu = "card"
icon = "workflow"
rows = "contextual"
call = "run"

[[contributes.menus]]
id = "run-on-terminal"
title = "Run workflow"
menu = "terminal"
icon = "workflow"
rows = "contextual"
call = "run"

[[contributes.attention]]
id = "gates"
title = "Approval gates"
icon = "hand"
rows = "gates"
call = "approve"
deny = "reject"

[[contributes.nodes]]
id = "launchAgent"
title = "Agent"
icon = "play"
category = "steps"

[[contributes.nodes]]
id = "script"
title = "Script"
icon = "terminal"
category = "steps"

[[contributes.nodes]]
id = "httpRequest"
title = "HTTP request"
icon = "globe"
category = "steps"

[[contributes.triggers]]
id = "manual"
title = "Manual"
icon = "zap"

[[contributes.triggers]]
id = "recurring"
title = "Recurring schedule"
icon = "clock"
timing = "cron"

[[contributes.triggers]]
id = "once"
title = "Schedule once"
icon = "calendar"
timing = "once"

[[contributes.triggers]]
id = "sessionRestored"
title = "Session restored"
icon = "rotate-ccw"

[[contributes.triggers]]
id = "webhook"
title = "Webhook"
icon = "globe"
timing = "webhook"
