[package]
name = "vorn-pipeline"
version = "0.7.5"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "A terminal's output on its own thread: screen model, scrollback ring and history framing, off the server's event loop"

[dependencies]
crc32fast = "1"
memchr = "2"
vorn-screen = { path = "../screen" }

[dev-dependencies]
serde_json = "1"
