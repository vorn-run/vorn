[package]
name = "vorn-web"
version.workspace = true
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Vorn in a browser: the desktop app's screens in a canvas, over vornd's WebSockets"

[lib]
crate-type = ["cdylib", "rlib"]

# Only a browser build has anything in it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
vorn-app = { path = "../vorn-app", default-features = false }
serde_json = "1"
web-time = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "History", "Navigator", "console"] }
