[package]
name = "vorn-connectors"
# Never published and never versioned on its own; the workspace carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "The Connectors built-in for Vorn: connections, the catalog, polls into the Workflows inbox, sign-in, and the built-in HTTP and MCP connectors, on the public extension API"

[dependencies]
# The pack store, the child and the manifest every package carries.
vorn-extensions = { path = "../extensions" }
vorn-spawn = { path = "../spawn", features = ["tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The MCP SDK an MCP connection's child is spoken to with.
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process"] }
uuid = { version = "1", features = ["v4"] }
vorn-vault = { path = "../vault" }
# The tools it adds to Vorn's MCP server are written with the server's own toolkit.
vorn-mcp = { path = "../mcp" }
# Blocking HTTP over rustls with ring, so nothing needs a C toolchain to build.
vorn-agents = { path = "../agents" }
vorn-store = { path = "../store" }
url = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "process", "io-util", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
