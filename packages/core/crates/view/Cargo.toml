[package]
name = "vorn-view"
# Never published and never versioned on its own; the workspace carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Extension templates: the typed node set, keyed rows and their bindings, checked strictly; KDL files read with the place of every error"

[features]
# Reading KDL files: vornd and the CLI check them; clients receive checked JSON.
kdl = ["dep:kdl"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
# Templates are KDL a person or an agent writes; spans give every node and entry its line and column.
kdl = { version = "6.7", optional = true, default-features = false, features = ["span"] }
