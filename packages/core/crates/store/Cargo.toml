[package]
name = "vorn-store"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Vorn's store on rusqlite: the same database file, schema and migrations as the server's database.ts"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
vorn-protocol = { path = "../protocol" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
