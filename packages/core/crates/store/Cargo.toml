[package]
name = "vorn-store"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Vorn's store on rusqlite: the database file, its schema and the calls on it"

[dependencies]
# `hooks` for the authorizer that holds an extension to its own tables.
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
vorn-protocol = { path = "../protocol" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
vorn-agents = { path = "../agents" }
tempfile = "3"
# The seeded workflows are files the Workflows built-in ships.
vorn-workflow-file = { path = "../workflow-file" }
