[package]
name = "vorn-workflow-file"
# Never published and never versioned on its own; the workspace carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Workflows as files: the TOML a workflow is written in (a trigger and steps, needs as the graph's edges), read with file:line:col errors, written, and written back keeping a person's comments"

[dependencies]
# Format-preserving TOML with spans: errors name their line, and a write-back keeps a person's comments. Already in the tree.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
