[package]
name = "ext-ui-host"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spike: one extension's UI as declarative views (A) or as a vornui component in WebAssembly (B)"

[dependencies]
vornui = { path = "../../../crates/vornui" }
wasmtime = { version = "49", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "cache"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }
serde_json = "1"
tungstenite = "0.28"
