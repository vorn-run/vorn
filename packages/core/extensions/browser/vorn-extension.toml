id = "vorn.browser"
name = "Browser"
version = "0.9.0"
api = "vorn:extension@0.9"
publisher = "Vorn"
description = "Web pages in tabs beside a session's terminal, opened from its card or by its agent, which reads them, finds in them and acts on them with its browser tools. Off, the browser pane and the agent's browser tools are gone."

[declares]
uses = ["web", "sessions.read", "storage"]

[service]
component = "browser.wasm"

[[contributes.panes]]
id = "browser"
title = "Browser"
tree = true
