[package]
name = "vorn-ext-worktrees"
# Never published and never versioned on its own; the workspace carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Worktree cleanup, an extension Vorn ships as a Wasm component: idle worktrees offered for removal, and the Worktrees settings page"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vorn-extension-sdk = { path = "../../crates/extension-sdk" }
