id = "vorn.files"
name = "Files"
version = "0.9.0"
api = "vorn:extension@1.0"
publisher = "Vorn"
description = "A session's files beside its terminal: the folder as a tree, files opened in tabs, edited, found in and saved, and popped out into cards of their own. Off, the Files pane and its cards are gone; the files are untouched."

[declares]
uses = ["files.read", "files.write", "sessions.read", "storage"]

[service]
component = "files.wasm"

[[contributes.panes]]
id = "files"
title = "Files"
tree = true

[[contributes.cards]]
id = "file"
title = "File"
tree = true
rows = "cards"
