[package]
name = "vorn-ext-device"
# Never published and never versioned on its own; the workspace carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "The Device, an extension Vorn ships as a Wasm component: an iOS simulator beside a session's terminal, claimed from its card or by its agent, which drives its apps"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vorn-extension-sdk = { path = "../../crates/extension-sdk" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
