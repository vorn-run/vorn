id = "vorn.tasks"
name = "Tasks"
version = "0.9.0"
api = "vorn:extension@1.0"
publisher = "Vorn"
description = "The task board: each project's tasks moved across statuses by you, your agents and your workflows, their images, the task a session works on shown on its card, a pane beside a card listing its project's tasks, and the MCP task tools. Off, the tasks are kept as they are."

[declares]
uses = ["tasks.read", "tasks.write", "sessions.read", "workflows.write", "storage", "files.read"]

[service]
component = "tasks.wasm"
events = ["agent.conversation"]

[[contributes.views]]
id = "board"
title = "Tasks"
description = "The board of each project's tasks: a queue of todos for you and your agents."
icon = "list-todo"
key = "Mod+T"
tree = true
button = { setting = ["top_bar"] }

[[contributes.panes]]
id = "tasks"
title = "Tasks"
tree = true

[[contributes.preferences]]
id = "top_bar"
title = "Show in the top bar"
description = "Shows the Tasks button in the top bar. Off, Tasks still opens from its key, the command palette and a card's pane menu."
type = "bool"
default = true

[[contributes.badges]]
id = "task"
title = "Task in progress"
tree = true

[[contributes.nodes]]
id = "createTaskFromItem"
title = "Create task"
icon = "list-plus"
category = "connectors"

[[contributes.triggers]]
id = "taskCreated"
title = "Task created"
icon = "list-plus"

[[contributes.triggers]]
id = "taskStatusChanged"
title = "Task moved"
icon = "arrow-right-left"

[mcp.list_tasks]
description = "List tasks, optionally filtered by project, status, assigned agent, or workspace. Archived tasks are excluded by default; pass include_archived=true to include them."

[mcp.create_task]
description = "Create a new task in a project"

[mcp.get_task]
description = "Get a task by ID"

[mcp.update_task]
description = "Update a task's properties"

[mcp.delete_task]
description = "Delete a task by ID"

[mcp.archive_task]
description = "Archive a finished task (status must be done or cancelled). Archived tasks are hidden from default views but preserved and restorable."

[mcp.unarchive_task]
description = "Restore an archived task so it shows in default views again."
