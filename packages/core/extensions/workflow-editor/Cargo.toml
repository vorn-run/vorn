[package]
name = "vorn-ext-workflow-editor"
# Never published and never versioned on its own; the workspace carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "The Workflow editor, an extension Vorn ships as a Wasm component: the Workflows view's tree, Run workflow in the menus, and the approval gates waiting for a person"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vorn-extension-sdk = { path = "../../crates/extension-sdk" }
