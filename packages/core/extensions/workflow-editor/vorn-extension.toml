id = "vorn.workflow-editor"
name = "Workflow editor"
version = "0.9.0"
api = "vorn:extension@1.0"
publisher = "Vorn"
description = "The Workflows view: its runs and the editor, where each step is a card on a canvas; Run workflow in the grid's, a card's and a terminal's menus; and approval gates waiting for you beside agents asking. Off, workflows still run and keep their files."

[declares]
uses = ["workflows.read", "workflows.write", "process.run"]

[service]
component = "workflow-editor.wasm"
events = ["workflow.changed", "workflow.gates"]

[[contributes.views]]
id = "workflows"
title = "Workflows"
icon = "workflow"
tree = true

[[contributes.menus]]
id = "run"
title = "Run workflow"
menu = "grid"
icon = "workflow"
rows = "manual"
call = "run"

[[contributes.menus]]
id = "run-on-card"
title = "Run workflow"
menu = "card"
icon = "workflow"
rows = "contextual"
call = "run"

[[contributes.menus]]
id = "run-on-terminal"
title = "Run workflow"
menu = "terminal"
icon = "workflow"
rows = "contextual"
call = "run"

[[contributes.attention]]
id = "gates"
title = "Approval gates"
icon = "hand"
rows = "gates"
call = "approve"
deny = "reject"
