[package]
name = "vorn-ext-widget"
# Never published and never versioned on its own; the workspace carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "The Widget, an extension Vorn ships as a Wasm component: every agent's status and the tools they wait to use, in a small window over the others"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vorn-extension-sdk = { path = "../../crates/extension-sdk" }
