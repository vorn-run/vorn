[package]
name = "vorn-ext-blocks"
# Never published and never versioned on its own; the workspace carries the app version.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Shell blocks, an extension Vorn ships as a Wasm component: a shell's commands with their status and time, and the composer's history and completions"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vorn-extension-sdk = { path = "../../crates/extension-sdk" }
serde = { version = "1", features = ["derive"] }
