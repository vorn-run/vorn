[workspace]
members = [
  ".",
  "crates/screen",
  "crates/analysis",
  "crates/pipeline",
  "crates/term-proto",
  "crates/term-mirror",
  "crates/vorn-git",
  "crates/vornd",
  "crates/sessiond",
  "crates/sessiond-wire",
  "crates/recovery",
  "crates/engine",
  "crates/grid",
  "crates/grid-client",
  "crates/size",
  "crates/protocol",
  "crates/store",
]

[package]
name = "vorn-core"
version = "0.8.0-beta.2"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Vorn's native core, loaded into the Node server through napi-rs: thin adapters over the vorn-* crates"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6", "async", "tokio_rt"] }
napi-derive = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync"] }
vorn-git = { path = "crates/vorn-git" }
vorn-protocol = { path = "crates/protocol" }
vorn-store = { path = "crates/store" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
