# Plain library crates live in crates/ and know nothing of Node; this crate is
# the napi adapter over them, so the same logic can later serve vornd.
[workspace]
members = ["crates/*"]

[package]
name = "vorn-core"
version = "0.7.5"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Vorn's native core, loaded into the Node server through napi-rs"

[lib]
crate-type = ["cdylib"]

[features]
default = ["ghostty"]
# libghostty-vt is built from source by Zig 0.15.2, the version the pinned Ghostty commit requires. Turning it off lets the crate
# build on a machine without Zig, which is enough for the boundary itself.
ghostty = ["dep:libghostty-vt"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6", "async", "tokio_rt"] }
napi-derive = "3"
libghostty-vt = { version = "0.2.2", default-features = false, optional = true }
memchr = "2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync"] }
vorn-git = { path = "crates/vorn-git" }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[dev-dependencies]
serde_json = "1"
