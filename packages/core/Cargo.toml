[workspace]
resolver = "2"
members = [
  "crates/screen",
  "crates/analysis",
  "crates/pipeline",
  "crates/term-proto",
  "crates/term-mirror",
  "crates/vorn-git",
  "crates/vornd",
  "crates/sessiond",
  "crates/sessiond-wire",
  "crates/recovery",
  "crates/engine",
  "crates/extensions",
  "crates/grid",
  "crates/grid-client",
  "crates/size",
  "crates/protocol",
  "crates/store",
  "crates/agents",
  "crates/mcp",
  "crates/cli",
  "crates/reach",
  "crates/work",
  "crates/workflow",
  "crates/worktrees",
  "crates/vault",
  "crates/connectors",
  "crates/remote",
  "crates/hooks",
  "crates/logfile",
  "bench/scale",
]

# The app's version (scripts/sync-versions.sh); every binary that reports a version inherits it.
[workspace.package]
version = "0.8.0-beta.6"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# What CI tests and checks with: release optimisation without the whole-program
# LTO pass and single codegen unit, which every test binary would otherwise pay
# for at link time. The shipped binaries still build with `release`.
[profile.ci]
inherits = "release"
lto = "off"
codegen-units = 16
