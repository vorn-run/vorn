[workspace]
members = [".", "crates/screen", "crates/analysis"]

[package]
name = "vorn-core"
version = "0.7.5"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Vorn's native core, loaded into the Node server through napi-rs: thin adapters over the vorn-* crates"

[lib]
crate-type = ["cdylib"]

[features]
default = ["ghostty"]
# libghostty-vt is built from source by Zig 0.15.2, the version the pinned Ghostty commit requires. Turning it off lets the crate
# build on a machine without Zig, which is enough for the boundary itself.
ghostty = ["dep:libghostty-vt", "dep:vorn-screen"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
libghostty-vt = { version = "0.2.2", default-features = false, optional = true }
vorn-analysis = { path = "crates/analysis" }
vorn-screen = { path = "crates/screen", optional = true }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
