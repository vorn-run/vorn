publish:
  provider: github
  owner: vorn-run
  repo: vorn
  releaseType: release

appId: com.vorn.app
productName: Vorn
directories:
  buildResources: resources
  output: dist

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true

win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: '${productName}-Setup-${version}.${ext}'

portable:
  artifactName: '${productName}-Portable-${version}.${ext}'

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: resources/icon.png

electronFuses:
  # One-way: once on, turning it off corrupts every cookie Vorn has stored.
  enableCookieEncryption: true

npmRebuild: true
files:
  - 'out/**/*'
  - 'node_modules/**/*'
  # The core workspace would bring its cargo target/ with it; its binaries ship as extraResources below.
  - '!node_modules/@vornrun/core/**'
extraResources:
  - from: 'packages/web/dist'
    to: 'web/dist'
    filter:
      - '**/*'
  # vornd, the server, from `yarn build:core`; only one of the two exists on any platform.
  - from: 'packages/core/vornd'
    to: 'vornd/vornd'
  - from: 'packages/core/vornd.exe'
    to: 'vornd/vornd.exe'
  # vorn-sessiond, beside vornd, which installs it under $VORN_HOME/bin and
  # starts it from there.
  - from: 'packages/core/vorn-sessiond'
    to: 'vornd/vorn-sessiond'
  - from: 'packages/core/vorn-sessiond.exe'
    to: 'vornd/vorn-sessiond.exe'
  # The vorn command, built beside them. It starts vornd beside it when no
  # server runs.
  - from: 'packages/core/vorn'
    to: 'vornd/vorn'
  - from: 'packages/core/vorn.exe'
    to: 'vornd/vorn.exe'
  # On Windows, the ConPTY vorn-sessiond hosts its sessions in: conpty.dll
  # beside it and OpenConsole.exe in a folder for the architecture, which vornd
  # installs with it. Fetched by `yarn build:core` on Windows only.
  - from: 'packages/core/conpty.dll'
    to: 'vornd/conpty.dll'
  - from: 'packages/core/x64/OpenConsole.exe'
    to: 'vornd/x64/OpenConsole.exe'
  - from: 'packages/core/arm64/OpenConsole.exe'
    to: 'vornd/arm64/OpenConsole.exe'
  # Data, not a native module, so extraResources rather than asarUnpack.
  # idb_companion serves no reflection, so the client cannot discover the
  # schema at runtime — the proto has to ship.
  - from: 'resources/idb.proto'
    to: 'idb.proto'
  # The MIT license travels with the vendored schema: shipping the proto in a
  # built artifact without its attribution is what would breach the terms.
  - from: 'THIRD_PARTY_NOTICES.md'
    to: 'THIRD_PARTY_NOTICES.md'
