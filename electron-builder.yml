publish:
  provider: github
  owner: vorn-run
  repo: vorn
  releaseType: release

appId: com.vorn.app
productName: Vorn
directories:
  buildResources: resources
  output: dist

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true

win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: '${productName}-Setup-${version}.${ext}'

portable:
  artifactName: '${productName}-Portable-${version}.${ext}'

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: resources/icon.png

electronFuses:
  # One-way: once on, turning it off corrupts every cookie Vorn has stored.
  enableCookieEncryption: true

npmRebuild: true
afterPack: scripts/afterPack.cjs
files:
  - 'out/**/*'
  - 'node_modules/**/*'
  # The core workspace is linked into node_modules like every workspace, and
  # would bring its cargo target/ with it. Its one binary ships as an
  # extraResource below.
  - '!node_modules/@vornrun/core/**'
asarUnpack:
  - 'node_modules/libsql/**'
  - 'node_modules/@libsql/**'
  - 'node_modules/@neon-rs/**'
  - 'node_modules/detect-libc/**'
extraResources:
  - from: 'packages/server/dist'
    to: 'server'
    filter:
      - '**/*'
  - from: 'packages/web/dist'
    to: 'web/dist'
    filter:
      - '**/*'
  # The Rust core, beside the server that loads it rather than in asarUnpack:
  # the server runs from resources/server, outside the asar, and looks for
  # ../core/vorn_core.node. Built per platform by `yarn build:core`; when it was
  # not built the entry is skipped and VORN_CORE=native falls back to js.
  - from: 'packages/core/vorn_core.node'
    to: 'core/vorn_core.node'
  # vornd, from the same `yarn build:core`. Only one of the two exists on any
  # platform; the app runs it only when its Experimental switch is on, and goes
  # straight to the server when the file is not there.
  - from: 'packages/core/vornd'
    to: 'vornd/vornd'
  - from: 'packages/core/vornd.exe'
    to: 'vornd/vornd.exe'
  # vorn-sessiond, beside vornd, which installs it under $VORN_HOME/bin and
  # starts it from there.
  - from: 'packages/core/vorn-sessiond'
    to: 'vornd/vorn-sessiond'
  - from: 'packages/core/vorn-sessiond.exe'
    to: 'vornd/vorn-sessiond.exe'
  # Data, not a native module, so extraResources rather than asarUnpack.
  # idb_companion serves no reflection, so the client cannot discover the
  # schema at runtime — the proto has to ship.
  - from: 'resources/idb.proto'
    to: 'idb.proto'
  # The MIT license travels with the vendored schema: shipping the proto in a
  # built artifact without its attribution is what would breach the terms.
  - from: 'THIRD_PARTY_NOTICES.md'
    to: 'THIRD_PARTY_NOTICES.md'
