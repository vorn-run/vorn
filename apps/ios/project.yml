name: Vorn
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    # build.sh signs with a development profile after the build.
    CODE_SIGNING_ALLOWED: NO
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_OBJC_BRIDGING_HEADER: Vorn/Bridge.h
    LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../../packages/core/target/aarch64-apple-ios/release
    OTHER_LDFLAGS: [-lvorn_phone]
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: iphoneos
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Vorn:
    type: application
    platform: iOS
    sources: [Vorn]
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_NAME: Vorn
        PRODUCT_BUNDLE_IDENTIFIER: run.vorn.ios
    info:
      path: Vorn/Info.plist
      properties:
        CFBundleDisplayName: Vorn
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Connects to Vorn on your computer.
        NSCameraUsageDescription: Vorn uses the camera to scan the pairing code shown by the desktop app.
        UIUserInterfaceStyle: Dark
        VornHost: $(VORN_HOST)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
