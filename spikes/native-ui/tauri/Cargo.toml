[package]
name = "vorn-spike-tauri"
version = "0.0.0"
edition = "2021"
publish = false
description = "Tauri prototype: the shared grid client in Rust, the panes drawn on a canvas in the system webview"

[[bin]]
name = "vorn-spike-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
spike-core = { workspace = true }
tauri = { version = "2", default-features = false, features = ["wry", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
