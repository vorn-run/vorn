[package]
name = "spike-shared"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "What both UI prototypes share: the grid client, a test vornd, load producers, the bench driver and process metrics"

[dependencies]
vorn-term-proto = { workspace = true }
vorn-term-mirror = { workspace = true }
vorn-grid-client = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "macros"] }
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Console"] }
