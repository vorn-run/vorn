# The GPUI prototype. Its own workspace so GPUI's pinned dependency tree
# stays out of the vornui lockfile. GPUI comes from Zed's repository at
# f16f9652ec57bf806e65b2a0d51bb92a63644914, fetched (shallow, sparse) into
# ../.deps/zed by fetch_zed.sh; Cargo.lock started as that commit's.
[workspace]
resolver = "2"

[package]
name = "gpui-proto"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
gpui = { path = "../.deps/zed/crates/gpui", default-features = false, features = ["font-kit", "test-support"] }
gpui_platform = { path = "../.deps/zed/crates/gpui_platform", default-features = false, features = ["font-kit", "test-support", "runtime_shaders"] }
spike-shared = { path = "../shared" }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"

# GPUI's headless renderer on Windows is its wgpu one; its window renderer
# there is DirectX 11, which has no offscreen path.
[target.'cfg(windows)'.dependencies]
gpui_wgpu = { path = "../.deps/zed/crates/gpui_wgpu", features = ["test-support"] }

[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
