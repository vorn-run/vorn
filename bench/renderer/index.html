<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>vorn renderer bench</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
        overflow: hidden;
      }
      #grid {
        position: fixed;
        inset: 0;
        display: grid;
        gap: 4px;
        padding: 4px;
        box-sizing: border-box;
      }
      #grid > div {
        min-width: 0;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <div id="host" style="position: fixed; inset: 0; pointer-events: none"></div>
    <script type="module" src="./page.ts"></script>
  </body>
</html>
