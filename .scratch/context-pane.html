<script>
  var state = { pane: 'tasks', scope: 'session', sel: 0 }

  // TASK_STATUS_TONE from lib/task-status.ts
  var TASK_TONE = {
    todo: 'idle',
    in_progress: 'live',
    in_review: 'blocked',
    done: 'settled',
    cancelled: 'idle'
  }
  var TASK_LABEL = {
    todo: 'Todo',
    in_progress: 'In Progress',
    in_review: 'In Review',
    done: 'Done',
    cancelled: 'Cancelled'
  }
  // WORKFLOW_STATUS_TONE from lib/workflow-status.ts
  var RUN_TONE = {
    waiting: 'blocked',
    error: 'broken',
    running: 'live',
    success: 'settled',
    pending: 'idle',
    skipped: 'idle',
    cancelled: 'idle'
  }

  var TASKS = [
    {
      t: 'Fix the flaky pty timer',
      s: 'in_progress',
      m: 'vorn · fix/flaky',
      agent: 'claude',
      here: true
    },
    {
      t: 'Pair a phone by scanning',
      s: 'in_review',
      m: 'vorn · PR #484',
      agent: 'copilot',
      here: false
    },
    { t: 'Fix SSH prompt double-dispose', s: 'todo', m: 'vorn · high', agent: null, here: false },
    {
      t: 'Pause git diff polling when hidden',
      s: 'todo',
      m: 'vorn · medium',
      agent: null,
      here: false
    },
    { t: 'Fix server crash not surfaced', s: 'todo', m: 'vorn · medium', agent: null, here: false }
  ]
  var RUNS = [
    {
      t: 'Full review',
      s: 'waiting',
      m: 'step 3 of 4 · 2m ago',
      agent: 'approval gate',
      here: true
    },
    {
      t: 'Issue → task',
      s: 'running',
      m: 'step 2 of 3 · now',
      agent: 'claude · headless',
      here: false
    },
    { t: 'Clean branches', s: 'success', m: 'succeeded · 18m ago', agent: null, here: false },
    { t: 'Nightly deps', s: 'error', m: 'failed at step 1 · 6h ago', agent: null, here: false }
  ]

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  }

  window.__artifactRender = function () {
    var tw = (window.__artifact && window.__artifact.tweaks) || {}
    var open = tw.pinned !== false
    var pane = document.getElementById('pane')
    var tab = document.getElementById('tab')

    pane.hidden = !open
    tab.hidden = open
    document.getElementById('toggle').className = 'icobtn' + (open ? ' on' : '')
    document.getElementById('tabtext').textContent = state.pane === 'tasks' ? 'Tasks' : 'Runs'

    var pills = document.querySelectorAll('.pill[data-pane]')
    for (var i = 0; i < pills.length; i++) {
      pills[i].className =
        'pill' + (open && pills[i].getAttribute('data-pane') === state.pane ? ' on' : '')
    }
    if (!open) return

    pane.style.width = (tw.width || 360) + 'px'

    var tasks = state.pane === 'tasks'
    var items = (tasks ? TASKS : RUNS).slice()
    if (state.scope === 'session')
      items = items.filter(function (i) {
        return i.here || i.agent
      })
    else if (state.scope === 'project') items = items.slice(0, 4)

    if (state.sel >= items.length) state.sel = 0
    var cur = items[state.sel]

    var rows = items
      .map(function (i, n) {
        var tone = tasks ? TASK_TONE[i.s] : RUN_TONE[i.s]
        var chip = i.agent
          ? '<span class="agent' +
            (i.here ? ' here' : '') +
            '">' +
            esc(i.agent) +
            (i.here ? ' · here' : '') +
            '</span>'
          : tasks
            ? '<span class="agent none">unassigned</span>'
            : ''
        return (
          '<div class="row' +
          (n === state.sel ? ' on' : '') +
          '" data-sel="' +
          n +
          '">' +
          '<span class="dot ' +
          tone +
          '"></span><div class="main">' +
          '<div class="t">' +
          esc(i.t) +
          '</div><div class="m">' +
          esc(i.m) +
          '</div>' +
          chip +
          '</div></div>'
        )
      })
      .join('')

    var scopes = [
      ['session', 'This session'],
      ['project', 'This project'],
      ['all', 'Everything']
    ]
      .map(function (s) {
        return (
          '<button data-scope="' +
          s[0] +
          '"' +
          (state.scope === s[0] ? ' class="on"' : '') +
          '>' +
          s[1] +
          '</button>'
        )
      })
      .join('')

    // The same w-20 field rows TaskDetailPanel already draws, so the selected
    // row is editable in place -- Agent is where you hand it to a session.
    var detail = cur
      ? tasks
        ? '<div class="f"><span class="k">Status</span><span class="v">' +
          '<span class="dot ' +
          TASK_TONE[cur.s] +
          '"></span>' +
          TASK_LABEL[cur.s] +
          '</span></div>' +
          '<div class="f"><span class="k">Agent</span><span class="v">' +
          '<span class="picker">' +
          esc(cur.agent || 'Unassigned') +
          ' ▾</span></span></div>' +
          '<div class="f"><span class="k">Branch</span><span class="v mono" style="font-size:11px">' +
          esc(cur.m.split(' · ')[1] || '—') +
          '</span></div>'
        : '<div class="f"><span class="k">Run</span><span class="v">' +
          '<span class="dot ' +
          RUN_TONE[cur.s] +
          '"></span>' +
          esc(cur.s) +
          '</span></div>' +
          '<div class="f"><span class="k">Step</span><span class="v mono" style="font-size:11px">' +
          esc(cur.m) +
          '</span></div>' +
          (cur.s === 'waiting'
            ? '<div class="f"><span class="k">Gate</span><span class="v">' +
              '<span class="picker">Approve</span><span class="picker">Reject</span></span></div>'
            : '')
      : ''

    document.getElementById('paneInner').innerHTML =
      '<div class="pane-h"><div class="top"><h3>' +
      (tasks ? 'Tasks' : 'Recent runs') +
      '</h3>' +
      '<span style="font-size:11px;color:var(--color-ink-faint)">' +
      items.length +
      '</span></div>' +
      '<div class="seg">' +
      scopes +
      '</div></div>' +
      '<div class="pane-b"><div class="sec">' +
      (tasks ? (state.scope === 'session' ? 'Here' : 'Open') : 'Runs') +
      ' <span class="n">' +
      items.length +
      '</span></div>' +
      rows +
      '</div>' +
      (detail ? '<div class="detail">' + detail + '</div>' : '') +
      '<div class="foot">Same panel in every view. <kbd>⌘.</kbd> toggles it.</div>'
  }

  function setTweak(k, v) {
    window.__artifact = window.__artifact || {}
    window.__artifact.tweaks = window.__artifact.tweaks || {}
    window.__artifact.tweaks[k] = v
    window.__artifactRender()
  }

  document.addEventListener('click', function (e) {
    var p = e.target.closest('[data-pane]')
    if (p) {
      state.pane = p.getAttribute('data-pane')
      state.sel = 0
      setTweak('pinned', true)
      return
    }
    var s = e.target.closest('[data-scope]')
    if (s) {
      state.scope = s.getAttribute('data-scope')
      state.sel = 0
      window.__artifactRender()
      return
    }
    var r = e.target.closest('[data-sel]')
    if (r) {
      state.sel = +r.getAttribute('data-sel')
      window.__artifactRender()
      return
    }
    if (e.target.closest('#toggle')) {
      var t = window.__artifact.tweaks || {}
      setTweak('pinned', t.pinned === false)
      return
    }
    if (e.target.closest('#tab')) {
      setTweak('pinned', true)
    }
  })

  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === '.') {
      e.preventDefault()
      var t = (window.__artifact && window.__artifact.tweaks) || {}
      setTweak('pinned', t.pinned === false)
    }
  })

  window.__artifactRender()
</script>
